<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blueprint dashboard · slide harness</title>
<!-- A stand-in for the client half of present.html: the brand tokens, a slide
     body that is a flex column, and the visual's own file. The fixture ctx is
     put on window.FHV_FIXTURES by the spec before this page loads. Nothing here
     talks to a server. -->
<link rel="stylesheet" href="/app/fundhub-brand.css">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}
#app{height:100vh;display:flex;flex-direction:column;overflow:hidden}
.slide{flex:1;min-height:0;display:flex;flex-direction:column;padding:16px}
.slide-hd{display:flex;align-items:center;gap:12px;margin-bottom:5px}
.slide-hd .mono{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--gray2)}
.slide-hd .rule{flex:1;height:1px;background:var(--line)}
.hair{height:2px;background:var(--spectrum);border-radius:2px;opacity:.9}
.slide-body{flex:1;min-height:0;margin-top:12px;overflow:hidden;display:flex;flex-direction:column}
</style>
</head>
<body>
<div id="app">
  <div class="slide">
    <div class="slide-hd"><span class="mono">B-03 / Capital Blueprint</span><div class="rule"></div></div>
    <div class="hair"></div>
    <div class="slide-body" id="slot"></div>
  </div>
</div>
<script src="/app/present-blueprint-demo.js"></script>
<script>
  (function () {
    function money(n) {
      if (n == null || !Number.isFinite(Number(n))) return "—";
      return "$" + Number(n).toLocaleString("en-US");
    }
    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (ch) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
      });
    }
    var which = new URLSearchParams(location.search).get("fx") || "full";
    var fixtures = window.FHV_FIXTURES || {};
    var ctx = fixtures[which];
    if (!ctx) {
      document.getElementById("slot").textContent = "No fixture named " + which + ".";
      return;
    }
    ctx.money = money;
    ctx.esc = esc;
    window.FHV_RENDER = function () {
      document.getElementById("slot").innerHTML = window.FHDeckVisuals.blueprintDemo(ctx);
    };
    window.FHV_RENDER();
  })();
</script>
</body>
</html>
