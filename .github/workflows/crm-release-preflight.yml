name: CRM read-only production release preflight
on:
  push:
    branches: [codex/crm-live-font-reconcile]
    paths: [.github/workflows/crm-release-preflight.yml]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install existing release tooling
        run: |
          npm ci --ignore-scripts
          npm install -g netlify-cli
      - name: Load the existing production read connection
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: node scripts/ship-env-from-netlify.mjs
      - name: Verify the actual runtime database role
        run: npm run guard:db
      - name: Diagnose existing public read latency and brand selection
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: |
          node --input-type=module -e "import dns from 'node:dns/promises';console.log(JSON.stringify(await dns.lookup('fundhub.ai',{all:true})))"
          curl -4 --silent --show-error --max-time 12 --output /dev/null --write-out 'portal IPv4 status=%{http_code} connect=%{time_connect} first=%{time_starttransfer} total=%{time_total} ip=%{remote_ip}\\n' https://fundhub.ai/portal-login.html || true
          node --input-type=module <<'JS'
          const paths=['/portal-login.html','/app/morning-brief.html','/app/my-numbers.html','/api/health?strict=1','/api/org-brand'];
          await Promise.all(paths.map(async path=>{
            const started=Date.now();
            try{
              const res=await fetch('https://fundhub.ai'+path,{signal:AbortSignal.timeout(10000),headers:{'user-agent':'FundhubPulse/1.0 (+https://fundhub.ai)'}});
              const text=await res.text();
              const out={path,status:res.status,ms:Date.now()-started,bytes:Buffer.byteLength(text)};
              if(path==='/api/org-brand'){try{const j=JSON.parse(text);const b=j.brand||j;out.brand={slug:b.slug,entity_name:b.entity_name,display_face:b.display_face};}catch{}}
              console.log(JSON.stringify(out));
            }catch(error){console.log(JSON.stringify({path,ms:Date.now()-started,error:error.name}));}
          }));
          JS
      - name: Run the existing read-only hourly release proof
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: npm run pulse:prove -- --beats
      # pulse:prove uses read-only transactions and recording sinks, permits only
      # GET/HEAD, and refuses writes/sends. No migrations, deployment or main update.
