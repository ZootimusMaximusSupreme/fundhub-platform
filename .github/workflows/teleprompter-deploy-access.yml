name: Check teleprompter deploy access
on:
  push:
    branches: [codex/teleprompter-take-flow-20261011]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Read existing deployment access without printing credentials
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import pg from "pg";
          import { EXPECTED_MIGRATIONS } from "./db/expected-migrations.mjs";
          const base = "https://api.netlify.com/api/v1";
          const headers = { Authorization: "Bearer " + process.env.NETLIFY_AUTH_TOKEN };
          const get = async (url) => {
            const r = await fetch(url, { headers, signal: AbortSignal.timeout(15000) });
            if (!r.ok) throw new Error("Netlify HTTP " + r.status);
            return r.json();
          };
          const site = await get(base + "/sites/" + encodeURIComponent(process.env.NETLIFY_SITE_ID));
          const vars = await get(base + "/accounts/" + encodeURIComponent(site.account_id) + "/env?site_id=" + encodeURIComponent(site.id));
          function value(key) {
            const v = vars.find(v => v.key === key);
            const item = v?.values?.find(x => x.context === "production") || v?.values?.find(x => x.context === "all");
            const text = typeof item?.value === "string" ? item.value : "";
            console.log(key + ": present=" + !!v + ", readable=" + !!text + ", secret=" + !!v?.is_secret);
            return text && !text.includes("*") ? text : "";
          }
          const token = value("SUPABASE_ACCESS_TOKEN");
          if (token && token !== process.env.SUPABASE_ACCESS_TOKEN) {
            const r = await fetch("https://api.supabase.com/v1/projects/oqpnlusrotpxfenysfxz/database/query", {
              method: "POST", headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
              body: JSON.stringify({ query: "SELECT 1 AS ok" }), signal: AbortSignal.timeout(15000)
            });
            console.log("Netlify stored Supabase credential HTTP " + r.status);
          } else console.log("No different readable Supabase credential on Netlify.");
          for (const key of ["MIGRATION_DATABASE_URL", "DATABASE_URL"]) {
            const url = value(key);
            if (!url) continue;
            const pool = new pg.Pool({ connectionString: url, connectionTimeoutMillis: 15000, query_timeout: 15000 });
            try {
              const privilege = await pool.query("SELECT has_schema_privilege(current_user, 'public', 'CREATE') AS can_create");
              const applied = new Set((await pool.query("SELECT key FROM schema_migrations")).rows.map(r => r.key));
              console.log(key + ": reachable, schema_create=" + !!privilege.rows[0].can_create + ", pending=" + EXPECTED_MIGRATIONS.filter(k => !applied.has(k)).length);
            } catch (e) {
              console.log(key + ": connection check failed, code=" + (e.code || "unknown"));
            } finally { await pool.end(); }
          }
          JS
