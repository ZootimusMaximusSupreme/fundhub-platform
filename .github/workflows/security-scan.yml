name: Fundhub dependency scan

on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: fundhub-dependency-scan
  cancel-in-progress: false

jobs:
  dependency-scan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Restore finding history
        id: history
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/security-history"
          gh run list --workflow security-scan.yml --branch main --limit 100 --json databaseId > "$RUNNER_TEMP/security-history-runs.json"
          while read -r run_id; do
            if [ "$run_id" = "$GITHUB_RUN_ID" ]; then continue; fi
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" > "$RUNNER_TEMP/security-history-artifacts.json"
            available=$(jq '[.artifacts[] | select(.name == "fundhub-dependency-scan" and .expired == false)] | length' "$RUNNER_TEMP/security-history-artifacts.json")
            if [ "$available" = 0 ]; then continue; fi
            gh run download "$run_id" --name fundhub-dependency-scan --dir "$RUNNER_TEMP/security-history/$run_id"
            # Failed runs can carry valid findings. Restore the newest ledger,
            # plus any later scan receipts, rather than requiring a green run.
            if [ -f "$RUNNER_TEMP/security-history/$run_id/security-findings.json" ] && jq -e '.tracking.complete == true' "$RUNNER_TEMP/security-history/$run_id/security-scan.json" > /dev/null; then break; fi
          done < <(jq -r '.[].databaseId' "$RUNNER_TEMP/security-history-runs.json")
      - name: Run production dependency audit
        id: audit
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > "$RUNNER_TEMP/security-audit-raw.json"
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Build finding receipt
        id: report
        env:
          AUDIT_STATUS: ${{ steps.audit.outputs.status }}
          TRACKING_RESTORE_OUTCOME: ${{ steps.history.outcome }}
        run: |
          node scripts/security-scan-report.mjs "$RUNNER_TEMP/security-audit-raw.json" "$RUNNER_TEMP/security-scan.json" "$RUNNER_TEMP/security-scan.md" "$AUDIT_STATUS" "$RUNNER_TEMP/security-findings.json" "$RUNNER_TEMP/security-history"
          cat "$RUNNER_TEMP/security-scan.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        id: receipts
        if: always()
        with:
          name: fundhub-dependency-scan
          path: |
            ${{ runner.temp }}/security-audit-raw.json
            ${{ runner.temp }}/security-scan.json
            ${{ runner.temp }}/security-scan.md
            ${{ runner.temp }}/security-findings.json
          if-no-files-found: error
          retention-days: 90
      - name: Keep findings, incomplete scans, and tracking failures red
        if: always()
        shell: bash
        run: |
          node scripts/security-scan-report.mjs --gate "$RUNNER_TEMP/security-scan.json" "${{ steps.history.outcome }}" "${{ steps.report.outcome }}" "${{ steps.receipts.outcome }}"
