# Ship main to live from GitHub (owner-set 2026-10-09).
#
# Chris: "make sure GitHub is the one pushing everything live" so a Claude cloud session on his phone
# can ship exactly like the Mac. A successful exact-main 14-check test run (after a merge) runs the SAME
# command the Mac runs: `npm run ship` (scripts/ship.mjs). That keeps every guard it already has:
# lint, the guard tests, pending database changes applied first, one production deploy, the
# /api/health check for pending 0, the Inngest re-register, the ship-log line, and the push back.
#
# Ship also skips on test failure, superseded commits, and ship-log-only commits. It skips when nothing has changed (ship.mjs step 3), so
# the ship-log commit it pushes back does not cause a second deploy. Netlify's own auto build stays
# OFF (stop_builds), so one push is one deploy, never two.
#
# Secrets (Settings -> Secrets and variables -> Actions): NETLIFY_AUTH_TOKEN, NETLIFY_SITE_ID,
# SUPABASE_ACCESS_TOKEN, SHIP_GITHUB_TOKEN (the repo token ship uses to push the ship log back),
# PRIVATE_LEADS_PAGE_B64 (the one page kept out of git; see the step below), plus the read-only
# pulse proof keys listed on the Ship step. Those vendor keys let the pre-deploy pulse verify the
# same live doors without sending a message, moving money, or changing provider data.
# Nothing here prints them; GitHub masks them in logs.

name: Ship to live

on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry:
        description: "Dry run: say what would ship, change nothing"
        type: boolean
        default: false

# One ship at a time. A second push waits; it is never cancelled mid-deploy.
concurrency:
  group: ship-main
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  release_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Verify 14/14 exact-main CI before deploying
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { releaseDecision } = await import(pathToFileURL(
              process.env.GITHUB_WORKSPACE+'/scripts/release-control.mjs').href);
            const { owner, repo } = context.repo;
            const branch = await github.rest.repos.getBranch({owner,repo,branch:'main'});
            const sha = branch.data.commit.sha;
            const commit = await github.rest.repos.getCommit({owner,repo,ref:sha});
            let run = context.eventName === 'workflow_run' ? context.payload.workflow_run : null;
            if (context.eventName === 'workflow_dispatch') {
              const found = await github.rest.actions.listWorkflowRuns({
                owner,repo,workflow_id:'tests.yml',branch:'main',head_sha:sha,per_page:50
              });
              run = found.data.workflow_runs.find(r=>r.event==='push' &&
                r.status==='completed' && r.conclusion==='success')||null;
            }
            const jobs = run?.head_sha===sha && run.conclusion==='success'
              ? await github.paginate(github.rest.actions.listJobsForWorkflowRun,
                  {owner,repo,run_id:run.id,per_page:100,filter:'latest'})
              : [];
            const verdict = releaseDecision({eventName:context.eventName,
              repo:owner+'/'+repo,mainSha:sha,mainMessage:commit.data.commit.message,
              testRun:run,jobs});
            core.setOutput('ready',String(verdict.status==='ship'));
            core.setOutput('sha',sha);
            core.info('Release gate: '+verdict.status+'; '+verdict.reason+'; '+sha);
            if (verdict.status==='fail')core.setFailed(verdict.reason);
            if (verdict.status==='skip')core.notice(verdict.reason);
  ship:
    needs: release_gate
    if: ${{ needs.release_gate.outputs.ready == 'true' }}
    # Back on Ubuntu (2026-10-20): macos-latest jobs sat queued with no runner and were
    # cancelled, so PR #83 could not ship. Ubuntu can time out at TLS in the read-only
    # release proof that runs after the deploy; that step can go red, the deploy stands.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_gate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Be on main, with a git name
        run: |
          git checkout -B main "${{ needs.release_gate.outputs.sha }}"
          git config user.name "Fundhub ship"
          git config user.email "ship@fundhub.ai"

      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm install -g netlify-cli

      # Git holds only the safe browser shell for this route. The live call list has real names and
      # phone numbers, so its complete page stays in an Actions secret and replaces that shell only
      # inside this disposable runner. Mark that one tracked file assume-unchanged before replacing
      # it so ship's clean-tree guard still catches every other uncommitted file. Nothing prints it.
      - name: Put the private pages in place
        env:
          PRIVATE_LEADS_PAGE_B64: ${{ secrets.PRIVATE_LEADS_PAGE_B64 }}
        run: |
          if [ -n "$PRIVATE_LEADS_PAGE_B64" ]; then
            mkdir -p public/leads/c01cb7592c8bb994130158e897e99bf1
            git update-index --assume-unchanged -- public/leads/c01cb7592c8bb994130158e897e99bf1/index.html
            printf '%s' "$PRIVATE_LEADS_PAGE_B64" | base64 -d > public/leads/c01cb7592c8bb994130158e897e99bf1/index.html
            echo "public/leads/" >> .git/info/exclude
            test -s public/leads/c01cb7592c8bb994130158e897e99bf1/index.html
            test -z "$(git status --porcelain)"
          fi

      - name: Load the existing production database connection
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: node scripts/ship-env-from-netlify.mjs

      - name: Verify existing designated client sample linkage without changing records
        run: |
          node --input-type=module <<'JS'
          import {db,close} from './src/db.mjs';
          import {clientSampleAccount} from './src/demo/client-portal-samples.mjs';
          try{
            const result=await db.query("SELECT id,org_id,client_id,email,kind,status FROM accounts WHERE lower(email)='client@fundhub.ai' AND kind='client' AND status='active'");
            let eligible=0;
            for(const account of result.rows){
              const matches=await clientSampleAccount(db,{kind:account.kind,accountId:account.id,clientId:account.client_id,orgId:account.org_id,email:account.email});
              if(matches===null)throw Error('Existing sample account linkage could not be verified');
              if(matches===true)eligible++;
            }
            console.log(JSON.stringify({designatedLogin:'client@fundhub.ai',verifiedEligibleAccounts:eligible,readOnly:true,credentialsChanged:false,recordsChanged:false}));
            if(eligible!==1)throw Error('Expected one existing account with the exact designated client fixture linkage; no records were changed');
          }finally{await close();}
          JS

      - name: Enforce exact main SHA before Ship
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const main=await github.rest.repos.getBranch({owner,repo,branch:'main'});
            const expected='${{ needs.release_gate.outputs.sha }}';
            const local=require('node:child_process').execFileSync(
              'git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
            if(expected!==main.data.commit.sha||expected!==local)
              core.setFailed('Main moved after CI; wait for its own 14/14 success.');

      - name: Ship
        env:
          CI: "true"
          EXPECTED_RELEASE_SHA: ${{ needs.release_gate.outputs.sha }}
          NODE_OPTIONS: "--dns-result-order=ipv4first"
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.SHIP_GITHUB_TOKEN }}
          AD_TOKEN_ENC_KEY: ${{ secrets.AD_TOKEN_ENC_KEY }}
          TWILIO_SEND_ACCOUNT_SID: ${{ secrets.TWILIO_SEND_ACCOUNT_SID }}
          TWILIO_SEND_AUTH_TOKEN: ${{ secrets.TWILIO_SEND_AUTH_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CORTANA_COMMAS_API_KEY: ${{ secrets.CORTANA_COMMAS_API_KEY }}
          FANBASIS_CHECKOUT_API_KEY: ${{ secrets.FANBASIS_CHECKOUT_API_KEY }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry }}
        run: |
          if [ "$DRY" = "true" ]; then npm run ship -- --dry; else npm run ship; fi

      - name: Verify published CRM and portal assets match this release
        env:
          NODE_OPTIONS: "--dns-result-order=ipv4first"
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const source=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const paths=['/app/my-numbers.html','/app/my-numbers.css','/app/pipeline.html','/app/sales-floor.html','/app/sales-floor.css','/app/finance-os.html','/app/csm-queue.html','/app/contracts.html','/app/lenders.html','/app/client-portal.html','/portal-login.html','/app/fundhub-font.css','/app/fundhub-font.js','/app/client-ios.css','/app/client-ios.js','/app/shell.js','/app/crm-sidebar.css','/app/workspace-ui.css','/assets/fonts/nunito-latin-variable.woff2'];
          const hash=data=>crypto.createHash('sha256').update(data).digest('hex');
          const results=[];
          for(let offset=0;offset<paths.length;offset+=4){
            const batch=await Promise.all(paths.slice(offset,offset+4).map(async path=>{
              const expected=hash(fs.readFileSync('public'+path));let last;
              for(let attempt=0;attempt<3;attempt++){
                try{
                  const response=await fetch('https://fundhub.ai'+path+'?release='+source,{headers:{'cache-control':'no-cache'},signal:AbortSignal.timeout(15000)});
                  if(!response.ok)throw Error('HTTP '+response.status);
                  const actual=hash(Buffer.from(await response.arrayBuffer()));
                  if(actual!==expected)throw Error('published bytes differ from checked source');
                  return {path,ok:true,sha256:actual};
                }catch(error){last=String(error.message);}
              }
              return {path,ok:false,reason:last};
            }));
            results.push(...batch);
          }
          const receipt={source,site:'https://fundhub.ai',checkedAt:new Date().toISOString(),readOnly:true,production:true,results};
          const output=process.env.RUNNER_TEMP+'/crm-live-assets.json';
          fs.writeFileSync(output,JSON.stringify(receipt,null,2));
          for(const result of results)console.log((result.ok?'PASS ':'FAIL ')+result.path+(result.reason?' '+result.reason:' '+result.sha256));
          if(results.some(result=>!result.ok))process.exitCode=1;
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-crm-portal-asset-verification
          path: ${{ runner.temp }}/crm-live-assets.json
          if-no-files-found: ignore
          retention-days: 14
