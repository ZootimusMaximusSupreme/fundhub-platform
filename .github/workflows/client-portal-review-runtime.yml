name: Client portal working review link
on:
  push:
    branches: [codex/client-portal-ios-redo, codex/crm-portal-layout-professional]
    paths:
      - .github/workflows/client-portal-review-runtime.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: client-portal-review-runtime
  cancel-in-progress: false
jobs:
  branch-runtime:
    if: github.ref == 'refs/heads/codex/client-portal-ios-redo' || github.ref == 'refs/heads/codex/crm-portal-layout-professional'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      CONTEXT: deploy-preview
    steps:
      - name: Check the existing hosting connection without printing credentials
        run: |
          test -n "$NETLIFY_AUTH_TOKEN" || { echo 'Missing GitHub Actions secret NETLIFY_AUTH_TOKEN'; exit 1; }
          test -n "$NETLIFY_SITE_ID" || { echo 'Missing GitHub Actions secret NETLIFY_SITE_ID'; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install the existing app and deployment CLI
        run: |
          npm ci --ignore-scripts
          npm install --global netlify-cli
      - name: Build and deploy a branch runtime, never production
        run: |
          # The existing deploy-preview build runs guard:db. It never migrates.
          # No --prod, production ship script, private customer page, or main merge.
          case "$GITHUB_REF_NAME" in
            codex/client-portal-ios-redo) review_alias=client-portal-ios-review ;;
            codex/crm-portal-layout-professional) review_alias=client-portal-professional-review ;;
            *) echo 'Refusing runtime deploy outside authorized review branches'; exit 1 ;;
          esac
          netlify deploy --build --context deploy-preview \
            --alias "$review_alias" \
            --message "Client portal review $GITHUB_SHA" --json > /tmp/portal-review-deploy.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const text=fs.readFileSync('/tmp/portal-review-deploy.json','utf8');
          let result;
          try { result=JSON.parse(text); } catch { throw new Error('Netlify did not return deployment JSON; inspect the build step.'); }
          const url=result.deploy_url || result.deploy_ssl_url;
          if(!url || !/^https:\/\//.test(url)) throw new Error('No verified branch deployment URL returned');
          let direct=url;
          const deployId=result.deploy_id || result.id;
          const match=new URL(url).hostname.match(/(?:^|--)(transcendent-wisp-888771)\\.netlify\\.app$/);
          if(deployId && /^[a-f0-9]+$/.test(String(deployId)) && match) {
            direct='https://'+deployId+'--'+match[1]+'.netlify.app';
          }
          const login=direct+'/login.html?next=%2Fapp%2Fclient-portal.html';
          const response=await fetch(login,{signal:AbortSignal.timeout(20000)});
          if(response.status!==200 || !/type=["']password["']/.test(await response.text())) throw new Error('Hosted sign-in failed the availability check');
          const stylesheet=await fetch(direct+'/app/client-ios.css',{signal:AbortSignal.timeout(20000)});
          if(stylesheet.status!==200 || !(await stylesheet.text()).includes('client-ios-header')) throw new Error('Hosted workspace stylesheet is missing');
          console.log('WORKING_PORTAL_URL='+login);
          console.log('WORKING_PORTAL_HOME='+direct+'/app/client-portal.html');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'Working portal: '+login+'\\n\\nHome: '+direct+'/app/client-portal.html\\n\\nSource: '+process.env.GITHUB_SHA+'\\n');
          JS
