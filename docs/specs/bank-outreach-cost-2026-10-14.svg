  <rect x="450" y="902" width="380" height="14" rx="7" fill="#18181B"/>
  <rect x="450" y="902" width="95" height="14" rx="7" fill="#A8D8B0" fill-opacity="0.35"/>
  <rect x="450" y="902" width="32" height="14" rx="7" fill="#A8D8B0"/>
  <text x="1000" y="918" font-size="24" font-weight="600" fill="#FCFCFC" text-anchor="end">$25–$75</text>

  <text x="80" y="973" font-size="24" fill="#E4E4E7">10 email mailboxes</text>
  <rect x="450" y="957" width="380" height="14" rx="7" fill="#18181B"/>
  <rect x="450" y="957" width="89" height="14" rx="7" fill="#A8D8B0"/>
  <text x="1000" y="973" font-size="24" font-weight="600" fill="#FCFCFC" text-anchor="end">about $70</text>

  <text x="80" y="1028" font-size="24" fill="#E4E4E7">AI reply agent</text>
  <rect x="450" y="1012" width="380" height="14" rx="7" fill="#18181B"/>
  <rect x="450" y="1012" width="63" height="14" rx="7" fill="#A8D8B0" fill-opacity="0.35"/>
  <text x="1000" y="1028" font-size="24" font-weight="600" fill="#FCFCFC" text-anchor="end">under $50</text>

  <rect x="80" y="1080" width="293" height="150" rx="18" fill="#111113" stroke="#26262B"/>
  <text x="106" y="1148" font-size="44" font-weight="700" fill="#F5CE8F">~9,000</text>
  <text x="108" y="1186" font-size="18" fill="#A1A1AA">banks and credit unions</text>

  <rect x="393" y="1080" width="293" height="150" rx="18" fill="#111113" stroke="#26262B"/>
  <text x="419" y="1148" font-size="44" font-weight="700" fill="#A9C6E8">~8,000</text>
  <text x="421" y="1186" font-size="18" fill="#A1A1AA">cold emails a month</text>

  <rect x="706" y="1080" width="294" height="150" rx="18" fill="#111113" stroke="#26262B"/>
  <text x="732" y="1148" font-size="44" font-weight="700" fill="#F2A69B">~800</text>
  <text x="734" y="1186" font-size="18" fill="#A1A1AA">bankers a month on LinkedIn</text>

  <text x="80" y="1294" font-size="32" font-weight="700" fill="#FCFCFC">fundhub.</text>
  <text x="1000" y="1284" font-size="16" fill="#71717A" text-anchor="end">Brave Search: $5 per 1,000 searches · FDIC and NCUA lists are free</text>
  <text x="1000" y="1308" font-size="16" fill="#71717A" text-anchor="end">Employee pay is separate</text>
