  <text x="80" y="778" font-size="24" fill="#E4E4E7">AI cleanup of results</text>
  <rect x="450" y="762" width="380" height="14" rx="7" fill="#18181B"/>
  <rect x="450" y="762" width="190" height="14" rx="7" fill="#C4B3E5" fill-opacity="0.35"/>
  <rect x="450" y="762" width="63" height="14" rx="7" fill="#C4B3E5"/>
  <text x="1000" y="778" font-size="24" font-weight="600" fill="#FCFCFC" text-anchor="end">$50–$150</text>

  <text x="80" y="862" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="16" letter-spacing="3" fill="#A8D8B0">EVERY MONTH</text>
