# Netlify deploy for fundhub-platform — static screens from public/ plus the
# existing Vercel-style api/ handlers running as one Netlify function.
# The Vercel files are untouched; when that account clears, both targets work.

[build]
  publish = "public"
  # Public/ is static and the functions are bundled by Netlify. The command
  # applies pending SQL (cloud build has MIGRATION_DATABASE_URL), then the
  # database privilege guard.
  #
  # This is no longer the ONLY gate in the repo — .github/workflows/tests.yml
  # now runs the suite on every push — but it is still the only one that sees a
  # REAL DATABASE_URL. CI points at a throwaway container; this build is the
  # single place the question "is the connection the live site uses actually
  # unprivileged?" can be asked and answered. Keep it.
  #
  # `npm run guard:db` runs ONE test file, deliberately not `npm test`. The
  # full suite has known pre-existing failures against a real database
  # (CLAUDE.md §12), so gating deploys on it would block every deploy on day
  # one and the gate would be removed within a week. A guard nobody can afford
  # to keep is not a guard.
  #
  # What it does: refuses the deploy if DATABASE_URL for this context points at
  # a superuser, or a role that can bypass Row Level Security, or is missing
  # from the build scope entirely. It runs per context, so production,
  # deploy-preview and branch-deploy are each checked with their own value.
  #
  # If this ever blocks a deploy you need to make, the escape is to revert this
  # line to the old `echo` — not to weaken src/security/superuser-guard.test.mjs.
  #
  # OWNER RULE, set 2026-08-19: MIGRATIONS RUN ON THE PRODUCTION DEPLOY ONLY.
  #
  # This default command is the one every context EXCEPT production uses —
  # deploy previews, branch deploys, and any context Netlify adds later. It
  # deliberately does NOT run db/migrate.mjs.
  #
  # Why the default is the safe one rather than the other way round: a context
  # with no block of its own falls back to here. If the migrating command were
  # the default, every new context would silently start writing to the live
  # database. This way a new context is inert until someone opts it in on
  # purpose.
  #
  # What went wrong. Until today this line read
  # `node db/migrate.mjs && npm run guard:db` for every context, and Netlify
  # supplies MIGRATION_DATABASE_URL to previews as well as to production. So
  # opening a pull request applied its migrations to the PRODUCTION database
  # immediately, before any human reviewed or merged it. Measured on 2026-08-19:
  # PR #86's three migrations landed on live at 03:20, twenty minutes before the
  # merge at 03:42. They were safe. A DROP, a rewrite, or a bad lock would have
  # been just as live, just as early, with nobody expecting it.
  #
  # `npm run guard:db` still runs everywhere. It reads nothing and writes
  # nothing — it refuses the deploy if DATABASE_URL points at a superuser or a
  # role that can bypass row locks — and that question is worth asking in every
  # context.
  #
  # The trade this buys, and it is a real one: a preview of a branch that adds a
  # migration now runs against a database that does not have it yet. Expect
  # /api/health to report `pending` above zero on such a preview, and expect any
  # screen depending on the new shape to fail there. That is the correct
  # failure — it belongs to the preview, not to production.
  #
  # Enforced in two places so it cannot be undone by accident:
  #   - src/security/migrations-production-only.test.mjs pins this file's shape
  #   - db/migrate.mjs refuses to run inside any Netlify build that is not
  #     production, whatever command invokes it
  command = "npm run guard:db"

# The ONLY context that migrates. Nothing else may.
#
# It also runs `guard:rls`, and ONLY it does. That check asks the live database
# "is any table locked shut — row security on with no policy attached?" and
# fails the build if one is, naming it. A table in that state reads zero rows
# and refuses every write without raising anything, so it is invisible until a
# human goes looking. `bookings` sat like that on 2026-08-19 and every incoming
# appointment was being thrown away.
#
# Why production only, and not in guard:db where every context would run it:
# previews no longer migrate, so a pending migration means the live database is
# legitimately behind this branch. Running the shape check there would fail
# every preview for a reason the preview cannot fix, and a guard that cries
# wolf gets deleted. Here it runs AFTER db/migrate.mjs, so it is checking a
# database this build has just brought up to date. That is the only moment the
# question has a fair answer.
[context.production]
  command = "node db/migrate.mjs && npm run guard:db && npm run guard:rls"

[build.environment]
  NODE_VERSION = "22"
  # Git production builds fail at Netlify secrets scanning when these env
  # values appear in docs/tests (agent prove phone, Oxylabs fixture strings).
  # Omit the key names so the scanner does not block the ship. Values stay
  # in Netlify env; nothing new is printed.
  SECRETS_SCAN_OMIT_KEYS = "CRS_LIVE_API_HOST,CRS_API_USERNAME,CRS_LIVE_API_USERNAME,FUNDHUB_REP_NUMBER,PULSE_SMS_TO,OXYLABS_USERNAME,OXYLABS_PASSWORD"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = [
    # Never ship local secrets or the huge local work trees inside credentials/.
    "!credentials/**",
    "assets/ebooks/fundhub-ebook-placeholder.pdf",
    "assets/gifts/message-blaster.dmg",
    "scripts/black-reports/**",
    # The flywheel stage files (avatar, ad research, owner notes). The offer
    # writer (/api/marketing/offer/generate) reads them as its default inputs;
    # without this line it finds no avatar on Netlify and refuses to guess.
    # GET /api/marketing/today reads the same files at request time
    # (src/marketing/flywheel-status.mjs). esbuild cannot see a file read, so
    # without this line the Today tab says the flywheel is "waiting" on Netlify.
    # (M10 and M12 both added this line; the release merge keeps one copy.)
    "marketing/flywheel/**",
    # The marketing machine's rule files (spec docs/specs/marketing-machine-2026-10-04.md
    # §6 Step 2, "Reads"). The writer and the rules routes read them from GitHub
    # at one commit (src/repo/github.mjs getContents); when GitHub cannot be
    # reached they fall back to these copies bundled with the function. A file
    # that does not exist yet (RECIPES.md, angles.json, banned-live.json and
    # catalog.json land in later units) simply matches nothing.
    # Never add anything under credentials/ here (the nft trap above).
    "marketing/ads/RULES.md",
    "marketing/ads/VOICE.md",
    "marketing/ads/RECIPES.md",
    "marketing/ads/angles.json",
    "marketing/ads/banned-live.json",
    "marketing/ads/registry.json",
    "marketing/broll/catalog.json",
    # src/finance/vendor/crs-engine.cjs is a one-line CommonJS shim:
    #   module.exports = require("../../../vendor/underwriteiq-full/…/engine.js")
    # esbuild leaves that require() external, so the zip shipped without the
    # vendor tree and EVERY scheduled function died at load with
    #   Cannot find module '../../vendor/underwriteiq-full/api/lite/crs/lender-matrix.js'
    # Measured 2026-09-06: from 17:50 the site had no working cron at all —
    # commas-inbox-sweeper, staff-message-sweeper, social-publish-sweeper,
    # hubstaff-poll-sweeper and creative-job-runner all threw on invoke. A
    # simulated $3,000 receipt sat pending for 20 minutes with nothing to drain
    # it, and the failure is silent: the queue row just stays `pending`, no
    # alarm, and the deploy that caused it is green.
    #
    # Same class as the two entries in external_node_modules below and as
    # scripts/black-reports/** above: a runtime path esbuild cannot see.
    "vendor/underwriteiq-full/**"
  ]
  # letter-generator.js require()s this at load time. esbuild leaves it
  # external, which 502s the whole /api/* function (login included).
  # pg is the same class: esbuild leaves the driver external and the zip
  # then has no node_modules/pg, so /api/health, login, and closer-drill
  # Start D1 all 502 with "Cannot find package 'pg'".
  external_node_modules = ["@pdf-lib/fontkit", "pg"]

# ---------------------------------------------------------------------------
# Scheduled jobs (Netlify cron). Declared here rather than with the
# @netlify/functions schedule() wrapper so no npm dependency is added
# (CLAUDE.md §8). Each SWEEP_CRON constant in the named file must match.
#
# This is NOT the Inngest engine. The jobs below are Netlify crons.
# INNGEST_EVENT_KEY stays ON permanently (owner-set 2026-08-20) and the
# workflow functions run (CLAUDE.md §11).
# ---------------------------------------------------------------------------
[functions."staff-message-sweeper"]
  schedule = "*/5 * * * *"

[functions."social-publish-sweeper"]
  schedule = "*/5 * * * *"

[functions."creative-job-runner"]
  schedule = "*/2 * * * *"

[functions."hubstaff-poll-sweeper"]
  schedule = "*/10 * * * *"

# The ad-video pipeline: Drive take -> Submagic -> b-roll -> export -> approval.
#
# A Netlify scheduled function, NOT the Inngest cron it used to be, and the
# reason is a wall clock. A pass downloads a whole take out of Drive and pushes
# it to Submagic; the first real one was 120 MB. Inside /api/inngest that runs
# in a SYNCHRONOUS function, which Netlify kills at 26 seconds — measured on
# production 2026-09-23, the pass was killed mid-upload and the take stopped
# dead. A scheduled function gets 15 minutes.
[functions."ad-video-sweeper"]
  schedule = "*/5 * * * *"

# Every minute, not every five. This one drains the Commas payment queue: the
# webhook only stores the bytes and answers, so nothing a client pays reaches
# the money chain until a pass runs. That delay is visible to a human.


[functions."commas-inbox-sweeper"]
  schedule = "* * * * *"

# ---------------------------------------------------------------------------
# Routing
#
# The CRM lives in the directory public/app/, so its URL is /app/. There used
# to be a public/app.html redirect stub alongside it, which meant two files
# claimed the same URL: Netlify resolves /app to the *file* app.html, while the
# stub's own script sent the browser to the /app/ — and /app/ normalises back to
# /app whenever a sibling .html exists. That is a redirect loop, and it is why
# /app never finished loading. The stub is gone; these rules make what is left
# explicit instead of leaving it to filename-resolution order.
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/app"
  to = "/app/"
  status = 301

# Old bookmarks and any link written before the move.
[[redirects]]
  from = "/app.html"
  to = "/app/"
  status = 301

# Decline Autopsy — SHELVED BY THE OWNER 2026-08-31.
# The sales page and its three handlers are built and correct; the delivery is
# being reworked, and it must not go live in the meantime. Its API routes are
# commented out in netlify/functions/api.mjs, so the page would load and then
# fail on its first read — a dead form is worse than no page. This sends anyone
# holding the link to the price menu instead.
# TO REOPEN: delete this rule, restore the three routes, restore the menu link.
[[redirects]]
  from = "/partner/autopsy/*"
  to = "/partner/menu/"
  status = 302
  force = true

# Published partner funnel pages (Brand Studio → partner_pages status=published).
[[redirects]]
  from = "/sites/*"
  to = "/.netlify/functions/partner-site/:splat"
  status = 200

# The api/ handlers run as one function. netlify/functions/api.mjs already
# declares `config.path = "/api/*"`; this rewrite is the belt to that braces, so
# /api/* still routes if the v2 path config is not honoured. The function
# tolerates either URL shape — see the prefix stripping in its handler.
[[redirects]]
  from = "/lender-climate"
  to = "/climate/"
  status = 301

# Hidden referral page. Pretty URL /optimize serves optimize.html on its own.
# /optimize.com needs this rewrite because the ".com" is part of the path.
[[redirects]]
  from = "/optimize.com"
  to = "/optimize.html"
  status = 200

# apply.fundhub.ai is a Netlify domain alias on this site (same public/ as fundhub.ai).
# External DNS: CNAME apply → transcendent-wisp-888771.netlify.app (see ops/apply-fundhub-netlify.md).

# The $297 sales page has ONE address: https://apply.fundhub.ai/roadmap (the
# ClickFunnels page, owner ask 2026-10-02 — one URL so tracking and Clarity are
# not split). The old copy in public/roadmap/index.html is no longer served on
# fundhub.ai: /roadmap, /roadmap/ and /roadmap/index.html all 301 there. Netlify
# matches /roadmap and /roadmap/ to the same rule and passes the query string
# (UTMs, fbclid, ref, client_id) through. force = true because the folder exists.
#
# Only the sales page moves. public/roadmap/pay.html and pull.html stay where
# they are: pull.html is where Commas sends a payer when no return address is
# sent (src/slo/offer.mjs SLO_PULL_PATH). No rule here may catch them.
#
# Scoped to https://fundhub.ai on purpose. apply.fundhub.ai is still a domain
# alias on this site (DNS points it at ClickFunnels); a path-only rule would loop
# forever if that DNS were ever pointed back here. www.fundhub.ai already 301s to
# fundhub.ai with the path and query, and fundhub.ai forces https.
# Pinned by src/http/roadmap-canonical.test.mjs.
[[redirects]]
  from = "https://fundhub.ai/roadmap"
  to = "https://apply.fundhub.ai/roadmap"
  status = 301
  force = true

[[redirects]]
  from = "https://fundhub.ai/roadmap/"
  to = "https://apply.fundhub.ai/roadmap"
  status = 301
  force = true

[[redirects]]
  from = "https://fundhub.ai/roadmap/index.html"
  to = "https://apply.fundhub.ai/roadmap"
  status = 301
  force = true

# A sibling public/roadmap.html used to steal /roadmap (same class as the old
# /app.html stub). That file is now /optimize-plan.
[[redirects]]
  from = "/roadmap.html"
  to = "/optimize-plan"
  status = 301

# Old $297 diagnostic URL. Straight to the one sales page address, one hop.
[[redirects]]
  from = "/slo"
  to = "https://apply.fundhub.ai/roadmap"
  status = 301

[[redirects]]
  from = "/slo/*"
  to = "/roadmap/:splat"
  status = 301

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# fhconsulting.online is an alias on this site. The edge function
# netlify/edge-functions/fhconsulting-host.js serves public/consulting/ at
# the domain root so the Fundhub homepage never shows on the consulting domain.
[[edge_functions]]
  function = "fhconsulting-host"
  path = "/*"
