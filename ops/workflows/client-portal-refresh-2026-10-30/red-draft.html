<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client portal refresh — marked draft</title>
<style>
  :root{font:16px/1.5 system-ui,sans-serif;color:#17191b;background:#f5f6f7}
  body{margin:0;padding:24px}main{max-width:1500px;margin:auto}h1{font-size:28px;margin:0 0 8px}
  p{margin:0 0 18px;color:#51565c}.key{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px}
  .key span{background:white;border:2px dashed #315fc4;border-radius:8px;padding:8px 12px;font-weight:650}
  figure{margin:0;background:#fff;border:1px solid #d5d9de;border-radius:12px;overflow:hidden}
  .shot{position:relative;line-height:0}.shot img{width:100%;display:block}
  svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .bad{fill:rgba(245,35,35,.08);stroke:#dc2626;stroke-width:6}
  .arrow{fill:none;stroke:#facc15;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
  .num{fill:#dc2626}.numtext{fill:white;font:700 32px system-ui;text-anchor:middle;dominant-baseline:central}
  figcaption{padding:18px 22px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  figcaption div{border-left:4px solid #dc2626;padding-left:10px}
  figcaption b{display:block}
  @media(max-width:700px){body{padding:12px}figcaption{grid-template-columns:1fr}.numtext{font-size:40px}}
</style>
<main>
  <h1>Client portal refresh · current screen</h1>
  <p>Red marks show what changes. Blue boxes show the new reading order. The source screenshot is Chris’s 10:27 AM staff view.</p>
  <div class="key"><span>1 File and next action first</span><span>2 Welcome video after the task</span><span>3 Tools and offers below the file</span></div>
  <figure><div class="shot"><img src="before.png" alt="Current staff client portal screenshot">
    <svg viewBox="0 0 1702 1424" aria-hidden="true">
      <defs><marker id="head" markerWidth="15" markerHeight="15" refX="12" refY="7" orient="auto"><path d="M0 0L15 7L0 14" fill="none" stroke="#facc15" stroke-width="3"/></marker></defs>
      <rect class="bad" x="3" y="103" width="1695" height="53" rx="6"/><path class="arrow" d="M360 182 L250 143" marker-end="url(#head)"/><circle class="num" cx="384" cy="193" r="27"/><text class="numtext" x="384" y="193">1</text>
      <rect class="bad" x="37" y="244" width="870" height="38" rx="6"/><path class="arrow" d="M1030 239 L906 264" marker-end="url(#head)"/><circle class="num" cx="1057" cy="229" r="27"/><text class="numtext" x="1057" y="229">2</text>
      <rect class="bad" x="38" y="293" width="1602" height="557" rx="10"/><path class="arrow" d="M1450 248 L1510 300" marker-end="url(#head)"/><circle class="num" cx="1435" cy="229" r="27"/><text class="numtext" x="1435" y="229">3</text>
      <rect class="bad" x="38" y="871" width="1602" height="97" rx="10"/><path class="arrow" d="M1360 1005 L1350 967" marker-end="url(#head)"/><circle class="num" cx="1368" cy="1030" r="27"/><text class="numtext" x="1368" y="1030">4</text>
    </svg></div>
    <figcaption>
      <div><b>1 · Old black header</b>Use the white CRM-style workspace header already built for clients.</div>
      <div><b>2 · Wrong file message</b>A staff visit without a selected client needs a “Choose a client” action.</div>
      <div><b>3 · Video takes the first screen</b>Put real file status and the next action above it.</div>
      <div><b>4 · File card appears with no file</b>Hide file-specific cards until a real client is selected.</div>
    </figcaption>
  </figure>
</main></html>
