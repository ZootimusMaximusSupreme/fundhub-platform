<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Fundhub — Reset password</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/fh.css">
<script src="/pw-toggle.js" defer></script>
</head><body>
<div class="spectrum"></div>
<div class="login-box">
  <div class="card">
    <h1>fundhub matrix</h1>
    <p class="sub" style="margin:0">Set a new password</p>
    <div class="err" id="err"></div>
    <div class="note" id="noToken" style="display:none">
      This link is missing its token. Ask whoever sent it for a fresh one.
      Invite links last 7 days. Reset links last 1 hour. Each link works once.
    </div>
    <form id="f">
      <input id="pw1" type="password" placeholder="new password (12+ characters)" autocomplete="new-password" required minlength="12">
      <input id="pw2" type="password" placeholder="type it again" autocomplete="new-password" required minlength="12">
      <button class="btn primary" id="go" type="submit">Set password</button>
    </form>
    <p class="note" id="okMsg" style="display:none">
      Password set. Every device signed in as this account has been signed out.
      <a href="/login.html" style="text-decoration:underline">Sign in now →</a>
    </p>
    <p class="note"><a href="/login.html" style="text-decoration:underline">← Back to sign in</a></p>
  </div>
</div>
<script>
var token = new URLSearchParams(location.search).get("token");
var form = document.getElementById("f");
if (!token) {
  document.getElementById("noToken").style.display = "block";
  form.style.display = "none";
}

form.addEventListener("submit", async function (e) {
  e.preventDefault();
  var err = document.getElementById("err"), btn = document.getElementById("go");
  err.style.display = "none";
  var pw1 = document.getElementById("pw1").value, pw2 = document.getElementById("pw2").value;
  if (pw1 !== pw2) {
    err.style.display = "block"; err.textContent = "Those two passwords don't match.";
    return;
  }
  btn.disabled = true; btn.textContent = "Setting…";
  var data = null;
  try {
    var r = await fetch("/api/auth/reset", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ action: "confirm", token: token, password: pw1 })
    });
    try { data = await r.json(); } catch (e2) { data = null; }
    if (!data || !data.ok) {
      err.style.display = "block";
      err.textContent = (data && data.detail) || "That link is invalid or has expired. Ask for a new one.";
      btn.disabled = false; btn.textContent = "Set password";
      return;
    }
  } catch (e3) {
    err.style.display = "block"; err.textContent = "Could not reach the server. Try again.";
    btn.disabled = false; btn.textContent = "Set password";
    return;
  }
  form.style.display = "none";
  document.getElementById("okMsg").style.display = "block";
});
</script>
</body></html>
