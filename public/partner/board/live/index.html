<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Winner's Board — Live</title>
<meta name="robots" content="noindex"/>
<link rel="icon" href="/favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"/>
<link rel="stylesheet" href="/app/fundhub-brand.css"/>
<!--
  THE LIVE BOARD. Not the sales page — that is /partner/board/, and it belongs
  to a different unit. This is the screen a subscriber opens after they have
  paid, and everything on it comes from GET /api/adintel/board.

  THREE THINGS ON THIS PAGE ARE NOT DECORATION AND MUST NOT BE REMOVED:

  1. THE LIMITATION BANNER. The ranks come from how long ads run and how hard
     advertisers push them, NOT from measured outcomes — there are zero measured
     paid closes on record. The wording is written by the API, not typed here,
     so it cannot be softened on the page without changing the API.

  2. THE NO-SPEND LINE. No competitor spend figure appears anywhere on this
     board and none ever will. Nobody publishes commercial ad spend — every
     spend number in every competing tool is inferred. Saying so is the honest
     version of a limitation every one of those tools hides.

  3. THE DO-NOT-COPY BADGE. An ad claiming a credit outcome or a guaranteed
     approval renders greyed with a banner. A partner who copies one gets
     FundHub's ad accounts banned and FundHub's name on a complaint. The badge
     is computed server-side and arrives on the row; this page only draws it.

  NO EARNINGS CLAIMS ANYWHERE. Nothing on this page is an income figure.
  "Offer" is what a COMPETITOR asked for in their own copy — a quoted price,
  never a result, and it is labelled that way.
-->
<style>
  /* ── BRAND. Every colour below is an ALIAS onto a token in
     public/app/fundhub-brand.css — the same pattern public/app/pipeline.html
     uses. Nothing here invents a hue.

     It did before. This screen shipped with its own :root carrying #188bf6,
     #DC2626, #D97706 and #16A34A — saturated web defaults that are nowhere in
     the brand, next to a palette that is deliberately soft and desaturated.
     That is why it read as off-brand: not the layout, the colour.

     Status tints are mixed DOWN from the spectrum stops rather than picked, so
     a badge can never introduce a colour the gradient does not already contain.
     ── */
  :root{
    --sans:var(--fh-sans,'Inter',system-ui,-apple-system,sans-serif);
    --mono:var(--fh-mono,'JetBrains Mono',ui-monospace,SFMono-Regular,monospace);
    --card:#FFFFFF;                 /* surface. The brand --card is the DARK card. */
    --ink2:var(--gray, #52525B);
    /* Score bands — peach / gold / grey, straight off the spectrum. */
    --hot:#B45647;  --warm:#9A6B1F;  --cold:var(--gray2,#A1A1AA);
    /* Crowding — mint through peach, the gradient's own run. */
    --open:#4F7F5B; --thin:#6B8F52; --contested:#9A6B1F; --crowded:#B45647;
    --hot-bg:color-mix(in srgb,var(--alert,#F2A69B) 30%,#fff);
    --warm-bg:color-mix(in srgb,var(--warn,#F5CE8F) 30%,#fff);
    --open-bg:color-mix(in srgb,var(--ok,#A8D8B0) 30%,#fff);
    --info-bg:color-mix(in srgb,var(--info,#A9C6E8) 30%,#fff);
    --blue:#3E6E9E;                 /* links — the spectrum's blue, darkened to pass contrast */
  }
  /* Numbers are the heroes, and they align. UI-STANDARDS §3. */
  .num,[class*=metric],[class*=score],td,th{font-variant-numeric:tabular-nums}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
  .wrap{max-width:1120px;margin:0 auto;padding:0 20px}
  header{border-bottom:1px solid var(--line);background:var(--card);padding:18px 0}
  .logo{font-weight:700;font-size:20px;letter-spacing:-.03em}
  .logo span{color:var(--blue)}
  .head-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  h1{font-size:32px;letter-spacing:-.025em;margin:32px 0 8px;font-weight:600}
  .sub{color:var(--gray);margin:0 0 18px}

  .limit-note{background:#FFF7ED;border:1px solid #FED7AA;border-radius:10px;padding:14px 16px;margin:0 0 18px}
  .limit-note p{margin:0 0 8px;font-size:15px}
  .limit-note p:last-child{margin:0}
  .limit-note strong{font-weight:600}

  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
  .tab{border:1px solid var(--line);background:var(--card);border-radius:999px;
       padding:8px 16px;font:inherit;font-size:15px;cursor:pointer;color:var(--ink2)}
  .tab[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 18px}
  /* display:flex beats the browser's default [hidden]{display:none}, so an
     element toggled with .hidden = true stays on screen. Stated once, for
     everything on the page, rather than per-element. */
  [hidden]{display:none !important}
  .filters label{font-size:12px;color:var(--gray)}
  select{font:inherit;font-size:15px;padding:8px;border:1px solid var(--line);
         border-radius:8px;background:var(--card);color:var(--ink)}

  .state{border:1px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--gray)}
    .state h2{font-size:20px;color:var(--ink);margin:0 0 8px;font-weight:600}

  .cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
  .card{border-radius:12px;background:var(--soft);padding:16px}
  .card.blocked{background:repeating-linear-gradient(135deg,var(--soft),var(--soft) 8px,#fff 8px,#fff 16px);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--alert) 40%,#fff)}
  .card-top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:8px}
  .rank{font-family:var(--mono);font-size:32px;font-weight:500;letter-spacing:-.03em;line-height:1;color:var(--ink)}
  .band{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
        padding:3px 8px;border-radius:999px;border:1px solid currentColor}
  .band.hot{color:var(--hot)} .band.warm{color:var(--warm)} .band.cold{color:var(--cold)}
  .hook{font-size:20px;font-weight:600;margin:0 0 8px;line-height:1.3;letter-spacing:-.01em}
  .meta{font-size:12px;color:var(--gray);font-family:var(--mono);margin:0 0 16px;word-break:break-word}
  .sig{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:12px;background:#fff;border-radius:8px;padding:4px 8px;color:var(--ink2)}
  .chip.unknown{color:var(--gray2);background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
  .warn{margin-top:16px;font-size:12px;font-weight:600;color:var(--hot);
        border-top:1px solid #FECACA;padding-top:9px}
  .delta{font-family:var(--mono);font-size:12px}
  .delta.up{color:var(--open)} .delta.down{color:var(--hot)} .delta.flat{color:var(--gray2)}

  table{border-collapse:collapse;width:100%;font-size:15px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--gray);font-weight:600}
  td.num{font-family:var(--mono)}

  .grid-legend{display:flex;gap:16px;flex-wrap:wrap;margin:0 0 16px;font-size:12px;color:var(--gray)}
  .swatch{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .swatch.open{background:var(--open)} .swatch.thin{background:var(--thin)}
  .swatch.contested{background:var(--contested)} .swatch.crowded{background:var(--crowded)}
  .cell-open td.crowd{color:var(--open)} .cell-thin td.crowd{color:var(--thin)}
  .cell-contested td.crowd{color:var(--contested)} .cell-crowded td.crowd{color:var(--crowded)}
  .angle-bar{height:8px;border-radius:4px;background:var(--line)}
  .angle-bar i{display:block;height:8px;border-radius:4px;background:var(--blue)}
  footer{color:var(--gray);font-size:12px;padding:32px 0 48px}
  @media (max-width:640px){ .cards{grid-template-columns:1fr} }
</style>
</head>
<body>
<header>
  <div class="wrap head-row">
    <div class="logo">fundhub<span>.</span></div>
    <div>
      <label for="week">Week</label>
      <select id="week"><option value="">latest</option></select>
    </div>
  </div>
</header>

<main class="wrap">
  <h1>Winner's Board</h1>
  <p class="sub" id="subtitle">Ads running in the small-business-funding market, and which ones refuse to die.</p>

  <div class="limit-note" id="notes"></div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-view="movers" aria-selected="true">This week's movers</button>
    <button class="tab" role="tab" data-view="death-watch" aria-selected="false">Death watch</button>
    <button class="tab" role="tab" data-view="saturation" aria-selected="false">Saturation map</button>
    <button class="tab" role="tab" data-view="new-entrants" aria-selected="false">New entrants</button>
  </div>

  <div class="filters" id="filters">
    <label for="angle">Angle</label>
    <select id="angle"><option value="">any</option></select>
    <label for="band">Band</label>
    <select id="band">
      <option value="">any</option><option value="hot">hot</option>
      <option value="warm">warm</option><option value="cold">cold</option>
    </select>
    <label for="platform">Platform</label>
    <select id="platform">
      <option value="">any</option><option value="meta">meta</option>
      <option value="google">google</option><option value="youtube">youtube</option>
      <option value="tiktok">tiktok</option>
    </select>
  </div>

  <div id="out"></div>
</main>

<footer class="wrap">
  <p>Competitor creative is rented from vendor ad libraries. Fundhub does not scrape any ad platform.</p>
</footer>

<script>
(function () {
  "use strict";

  /* ────────────────────────────────────────────────────────────────────────
     THE READ.

     public/app/data.js is the shared data layer for the staff app, but its
     read() helper prefixes /api/read/ and this endpoint is not under that
     prefix. Rather than edit a shared file for one screen, this page carries
     the same FAILURE TAXONOMY that file argues for at length, because the
     distinctions it draws are the ones that matter here too:

       unauthorized — signed out, or the session is stale
       offline      — /api/* is not reachable at all
       server       — our side answered, and answered with an error
       badrequest   — the request was wrong, which is not an outage

     A 500 announced to the user as "the database is down" sends whoever is
     paged to look at Postgres while the fault sits in the function logs.
     ──────────────────────────────────────────────────────────────────────── */
  function token() {
    try { return localStorage.getItem("fh_token") || ""; } catch (e) { return ""; }
  }

  function load(params) {
    var q = [];
    for (var k in params) {
      if (Object.prototype.hasOwnProperty.call(params, k) && params[k]) {
        q.push(encodeURIComponent(k) + "=" + encodeURIComponent(params[k]));
      }
    }
    var t = token();
    var headers = { accept: "application/json" };
    if (t) headers.authorization = "Bearer " + t;

    return fetch("/api/adintel/board" + (q.length ? "?" + q.join("&") : ""), { headers: headers })
      .then(function (r) {
        if (r.status === 401 || r.status === 403) {
          return { ok: false, reason: "unauthorized" };
        }
        return r.json().then(function (d) {
          if (r.status === 400) return { ok: false, reason: "badrequest", message: d && d.message };
          if (!d || d.ok !== true) return { ok: false, reason: "server", message: d && d.message };
          return { ok: true, data: d };
        }).catch(function () { return { ok: false, reason: "offline" }; });
      })
      .catch(function () { return { ok: false, reason: "offline" }; });
  }

  var out = document.getElementById("out");
  var notesBox = document.getElementById("notes");
  var weekSel = document.getElementById("week");
  var angleSel = document.getElementById("angle");
  var bandSel = document.getElementById("band");
  var platformSel = document.getElementById("platform");
  var filters = document.getElementById("filters");
  var view = "movers";
  var weeksLoaded = false;

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }

  function state(title, body) {
    out.textContent = "";
    var box = el("div", "state");
    box.appendChild(el("h2", null, title));
    box.appendChild(el("p", null, body));
    out.appendChild(box);
  }

  /* NULL IS RENDERED AS "not known", NEVER AS A ZERO OR A DASH.
     A missing signal and a measured zero are different facts, and the whole
     scoring model depends on nobody confusing them. A chip that says
     "variants — not known" is honest; one that says "variants 0" is a lie the
     reader has no way to detect. */
  function chip(label, value, suffix) {
    if (value === null || value === undefined) {
      return el("span", "chip unknown", label + " — not known");
    }
    return el("span", "chip", label + " " + value + (suffix || ""));
  }

  function money(cents) {
    if (cents === null || cents === undefined) return null;
    var n = Number(cents) / 100;
    return "$" + n.toLocaleString("en-US", { maximumFractionDigits: 0 });
  }

  function renderNotes(d) {
    notesBox.textContent = "";
    if (!d || !d.notes) return;
    var a = el("p");
    a.appendChild(el("strong", null, "How these ranks are made. "));
    a.appendChild(document.createTextNode(d.notes.rankBasis));
    var b = el("p", null, d.notes.spend);
    notesBox.appendChild(a);
    notesBox.appendChild(b);
  }

  function renderMovers(items) {
    out.textContent = "";
    if (!items.length) { state("Nothing ranked in this week", "No creative in this week has enough signal to rank yet."); return; }
    var grid = el("div", "cards");
    items.forEach(function (r) {
      var card = el("div", "card" + (r.do_not_copy ? " blocked" : ""));

      var top = el("div", "card-top");
      top.appendChild(el("span", "rank", "#" + r.winner_score_rank));
      var right = el("span");
      if (r.rank_delta !== null && r.rank_delta !== undefined) {
        var d = Number(r.rank_delta);
        var cls = d > 0 ? "delta up" : d < 0 ? "delta down" : "delta flat";
        right.appendChild(el("span", cls, (d > 0 ? "↑ " : d < 0 ? "↓ " : "→ ") + Math.abs(d)));
        right.appendChild(document.createTextNode(" "));
      }
      if (r.winner_score_band) right.appendChild(el("span", "band " + r.winner_score_band, r.winner_score_band));
      top.appendChild(right);
      card.appendChild(top);

      // The hook line, verbatim. Never trimmed, never tidied — a paraphrased
      // hook teaches nobody anything.
      card.appendChild(el("p", "hook", r.hook_line || r.headline || "(no copy recorded)"));
      card.appendChild(el("p", "meta",
        [r.platform, r.angle, r.ad_format, r.funnel, r.destination_domain].filter(Boolean).join("  ·  ")));

      var sig = el("div", "sig");
      sig.appendChild(chip("ran", r.ad_age_days, " days"));
      sig.appendChild(chip("variants", r.variant_count));
      sig.appendChild(chip("relaunches", r.relaunch_count));
      sig.appendChild(chip("placements", r.placement_spread));
      sig.appendChild(chip("platforms", r.cross_platform_echo));
      if (r.landing_page_changed === true) sig.appendChild(el("span", "chip", "landing page changed"));
      if (r.tiktok_perf_bucket) sig.appendChild(el("span", "chip", "tiktok " + r.tiktok_perf_bucket));
      // A competitor's QUOTED price out of their own copy. Not an outcome, not
      // an earnings figure, and labelled as theirs.
      var price = money(r.offer_price_cents);
      if (price) sig.appendChild(el("span", "chip", "they quote " + price + (r.offer_term ? " / " + r.offer_term : "")));
      card.appendChild(sig);

      if (r.do_not_copy) {
        card.appendChild(el("div", "warn",
          "DO NOT COPY — this ad claims a credit outcome or a guaranteed approval. " +
          "Running the same claim risks your ad account and a complaint."));
      }
      grid.appendChild(card);
    });
    out.appendChild(grid);
  }

  function renderDeathWatch(items) {
    out.textContent = "";
    if (!items.length) {
      state("Nothing has dropped out yet",
        "Nothing that led the board has gone quiet for long enough to report. This fills in as leaders stop running.");
      return;
    }
    var intro = el("p", "sub",
      "These led the board and have not been observed for two weeks or more. " +
      "Knowing what stopped working is worth more than knowing what is running.");
    var table = el("table");
    var head = el("tr");
    ["Hook", "Angle", "Ran for", "Last seen", "Platform"].forEach(function (h) {
      head.appendChild(el("th", null, h));
    });
    table.appendChild(head);
    items.forEach(function (r) {
      var tr = el("tr");
      tr.appendChild(el("td", null, r.hook_line || r.headline || "(no copy recorded)"));
      tr.appendChild(el("td", null, r.angle || "unclassified"));
      tr.appendChild(el("td", "num", r.ad_age_days === null || r.ad_age_days === undefined ? "not known" : r.ad_age_days + " days"));
      tr.appendChild(el("td", "num", (r.last_observed_on || "").slice(0, 10) || "not known"));
      tr.appendChild(el("td", null, r.platform));
      table.appendChild(tr);
    });
    out.appendChild(intro);
    out.appendChild(table);
  }

  function renderNewEntrants(items) {
    out.textContent = "";
    if (!items.length) { state("No new advertisers this week", "Nobody new started running in the watched groups."); return; }
    var table = el("table");
    var head = el("tr");
    ["Advertiser", "Platform", "Ads seen", "First seen", "On the watch-list"].forEach(function (h) {
      head.appendChild(el("th", null, h));
    });
    table.appendChild(head);
    items.forEach(function (r) {
      var tr = el("tr");
      tr.appendChild(el("td", null, r.advertiser_id));
      tr.appendChild(el("td", null, r.platform));
      tr.appendChild(el("td", "num", r.creatives));
      tr.appendChild(el("td", "num", String(r.first_seen_at || "").slice(0, 10)));
      tr.appendChild(el("td", null, r.on_watch_list ? "yes" : "no — new to us"));
      table.appendChild(tr);
    });
    out.appendChild(table);
  }

  function renderSaturation(items, meta) {
    out.textContent = "";
    var intro = el("p", "sub",
      "How many DIFFERENT advertisers are running each combination. One advertiser " +
      "running forty ads is one competitor, not forty. An empty cell may be an " +
      "opening — or it may be empty for a reason. Treat it as a hypothesis.");
    out.appendChild(intro);

    var legend = el("div", "grid-legend");
    [["open", "nobody"], ["thin", "1-2"], ["contested", "3-5"], ["crowded", "6+"]].forEach(function (p) {
      var s = el("span");
      s.appendChild(el("i", "swatch " + p[0]));
      s.appendChild(document.createTextNode(p[0] + " (" + p[1] + ")"));
      legend.appendChild(s);
    });
    out.appendChild(legend);

    if (meta && meta.angles && meta.angles.length) {
      var max = meta.angles.reduce(function (a, x) { return Math.max(a, x.advertisers); }, 0) || 1;
      var at = el("table");
      var ah = el("tr");
      ["Angle", "Advertisers", "Ads", "Crowding", ""].forEach(function (h) { ah.appendChild(el("th", null, h)); });
      at.appendChild(ah);
      meta.angles.forEach(function (a) {
        var tr = el("tr", "cell-" + a.crowding);
        tr.appendChild(el("td", null, a.angle));
        tr.appendChild(el("td", "num", a.advertisers));
        tr.appendChild(el("td", "num", a.ads));
        tr.appendChild(el("td", "crowd", a.crowding));
        var barCell = el("td");
        var bar = el("div", "angle-bar");
        var fill = el("i");
        // Width is the one genuinely dynamic value on the page; every other
        // colour and size is a class.
        fill.style.width = Math.round((a.advertisers / max) * 100) + "%";
        bar.appendChild(fill);
        barCell.appendChild(bar);
        tr.appendChild(barCell);
        at.appendChild(tr);
      });
      out.appendChild(el("h2", null, "By angle"));
      out.appendChild(at);
    }

    out.appendChild(el("h2", null, "By angle, format and funnel"));
    if (!items.length) {
      out.appendChild(el("p", "sub", "No classified creative was observed in this week, so the grid is empty."));
      return;
    }
    var table = el("table");
    var head = el("tr");
    ["Angle", "Format", "Funnel", "Advertisers", "Ads", "Crowding"].forEach(function (h) {
      head.appendChild(el("th", null, h));
    });
    table.appendChild(head);
    items.forEach(function (c) {
      var tr = el("tr", "cell-" + c.crowding);
      tr.appendChild(el("td", null, c.angle));
      tr.appendChild(el("td", null, c.ad_format));
      tr.appendChild(el("td", null, c.funnel));
      tr.appendChild(el("td", "num", c.advertisers));
      tr.appendChild(el("td", "num", c.ads));
      tr.appendChild(el("td", "crowd", c.crowding));
      table.appendChild(tr);
    });
    out.appendChild(table);
  }

  function fillAngles(items) {
    if (angleSel.options.length > 1) return;
    var seen = {};
    items.forEach(function (r) { if (r.angle) seen[r.angle] = true; });
    Object.keys(seen).sort().forEach(function (a) {
      var o = document.createElement("option");
      o.value = a; o.textContent = a;
      angleSel.appendChild(o);
    });
  }

  function fillWeeks(rows) {
    if (weeksLoaded || !rows || !rows.length) return;
    weeksLoaded = true;
    rows.forEach(function (r) {
      var o = document.createElement("option");
      o.value = r.iso_week; o.textContent = r.iso_week + " (" + r.creatives + ")";
      weekSel.appendChild(o);
    });
  }

  function refresh() {
    filters.hidden = view !== "movers";
    state("Loading", "Reading the board.");

    load({
      view: view === "movers" ? "" : view,
      week: weekSel.value,
      angle: view === "movers" ? angleSel.value : "",
      band: view === "movers" ? bandSel.value : "",
      platform: view === "movers" ? platformSel.value : "",
      limit: view === "saturation" ? 200 : 60
    }).then(function (r) {
      if (!r.ok) {
        if (r.reason === "unauthorized") {
          state("Sign in to see the board", "This session is not signed in, or it has expired.");
        } else if (r.reason === "offline") {
          state("The board did not come back", "The page could not reach the server. Nothing on screen is live.");
        } else if (r.reason === "badrequest") {
          state("That request was not accepted", r.message || "Try a different week.");
        } else {
          state("Something went wrong", r.message || "The server answered with an error.");
        }
        return;
      }

      var d = r.data;
      renderNotes(d);
      if (d.week) {
        document.getElementById("subtitle").textContent =
          "Week " + d.week + (d.meta && d.meta.start ? " (" + d.meta.start + " to " + d.meta.end + ")" : "");
      }

      if (d.meta && d.meta.reason === "no_weeks_rolled_up") {
        state("The board has not been built yet", d.meta.message);
        return;
      }

      if (view === "movers") { fillAngles(d.items); renderMovers(d.items); }
      else if (view === "death-watch") renderDeathWatch(d.items);
      else if (view === "new-entrants") renderNewEntrants(d.items);
      else if (view === "saturation") renderSaturation(d.items, d.meta);
    });

    // The week list is its own read so the picker is populated even when the
    // current view is empty. A picker that only fills in on a successful board
    // read leaves someone stuck on an empty week with no way off it.
    if (!weeksLoaded) {
      load({ view: "weeks", limit: 12 }).then(function (r) {
        if (r.ok) fillWeeks(r.data.items);
      });
    }
  }

  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (btn) {
    btn.addEventListener("click", function () {
      Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (b) {
        b.setAttribute("aria-selected", b === btn ? "true" : "false");
      });
      view = btn.getAttribute("data-view");
      refresh();
    });
  });
  [weekSel, angleSel, bandSel, platformSel].forEach(function (s) {
    s.addEventListener("change", refresh);
  });

  refresh();
})();
</script>
</body>
</html>
