<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fundhub — Payments</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0A0A0A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="fundhub-brand.css">
<link rel="stylesheet" href="money-payments.css">
<!-- ══ PAYMENTS — CLARITY PAYMENTS + THE MONEY HELPER ═══════════════════════
     Owner-set 2026-10-06 (docs/finance/finance-os-direction-2026-10-06.md): a
     Clarity Payment is any debt a client owes Fundhub LLC or a subsidiary,
     including buy now, pay later plans. This page shows each one, what is
     coming up, what the money helper did, and a way to reach a person.
     Read: GET /api/money/payments. Board: ops/workflows/finance-os-pages-2026-10-06.md.

     CLIENT-FACING, SO NO shell.js — same reason as money.html. The gate is the
     endpoint: a client session only gets its own file; staff need ?client_id=.
     Staff (FINANCE) also see plan controls; a client never does.

     THIN SHELL. The section itself is FinanceOS.sections.payments in
     money-payments.js (styles in money-payments.css, all under .fh-payments),
     so the combined FinanceOS page can mount it. This page only adds the
     header, the money nav and the shared base rules below.

     .app on the wrapper so fundhub-brand.css sizes type to the four tokens.
     No px font sizes below (UI-STANDARDS §12.7). -->
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --surface:#FFFFFF;
  --text:var(--ink2);--text-dim:var(--gray);--text-faint:var(--gray2);
}
html,body{min-height:100%}
body{background:var(--paper);color:var(--text);font-family:var(--sans);font-size:var(--fs-body);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
ul{list-style:none}

/* header — same dark bar as money.html */
.mbar{background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 24px;min-height:52px;border-bottom:2px solid transparent;border-image:var(--spectrum) 1;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;min-width:0;flex:0 1 auto}
.brand .logo{height:15px;aspect-ratio:2698/543;flex-shrink:0}
.brand .sub{color:var(--gray2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbar a{color:var(--paper);text-decoration:underline;text-underline-offset:3px;min-height:40px;display:inline-flex;align-items:center}

/* shared money nav (board: ops/workflows/finance-os-pages-2026-10-06.md).
   The page you are on is a solid ink fill AND aria-current — never colour alone. */
.mnav{display:flex;gap:8px;padding:8px 24px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
.mnav a{display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border-radius:999px;text-decoration:none;white-space:nowrap;border:1px solid var(--line)}
.mnav a[aria-current="page"]{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}

main{padding:24px 24px 64px}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.head h1{font-weight:600;letter-spacing:-.01em;color:var(--ink)}
.btn-primary{min-height:44px;padding:8px 24px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:600}
.btn-primary:hover{background:var(--ink2)}
.btn-primary[disabled]{opacity:.6;cursor:default}

.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;margin-bottom:24px}
.two>*{grid-column:span 6}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 24px;box-shadow:var(--panel-shadow);min-width:0}
.eyebrow{display:block;font-family:var(--mono);font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);margin-bottom:8px}
.caption{color:var(--text-dim)}
.big,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.big{display:block;font-weight:500;color:var(--ink);line-height:1.2}
.num{font-weight:500;color:var(--ink)}
.tile{display:flex;flex-direction:column;gap:8px}

.block{margin-bottom:48px}
.block>h2{font-weight:600;color:var(--ink)}
.block>.caption{margin-bottom:16px}

.scroll-x{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:500;color:var(--text-dim);padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
.r{text-align:right}

.empty,.error{display:flex;flex-direction:column;gap:16px;align-items:flex-start;padding:24px}
.empty p,.error p{max-width:60ch}

.skel{display:flex;flex-direction:column;gap:8px}
.sk{display:block;border-radius:6px;background:linear-gradient(90deg,var(--soft),var(--line),var(--soft));background-size:200% 100%;animation:sk 1.2s ease-in-out infinite}
.sk-s{height:12px;width:40%}.sk-m{height:16px;width:70%}.sk-l{height:32px;width:60%}
@keyframes sk{0%{background-position:100% 0}100%{background-position:-100% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}

@media (max-width:760px){
  main{padding:16px 16px 48px}
  .mbar,.mnav{padding:8px 16px}
  .card{padding:16px}
}
</style>
</head>
<body>
<div class="app">
  <header class="mbar">
    <div class="brand">
      <div class="logo inv" role="img" aria-label="Fundhub"></div>
      <div class="sub">Money</div>
    </div>
    <a id="money-back" href="client-portal.html">Back to my portal</a>
  </header>
  <nav class="mnav" id="money-nav" aria-label="Money">
    <a href="/app/money.html">Money</a>
    <a href="/app/money-accounts.html">Accounts</a>
    <a href="/app/money-credit.html">Credit</a>
    <a href="/app/money-connections.html">Connections</a>
    <a href="/app/money-payments.html" aria-current="page">Payments</a>
    <a href="/app/money-setup.html">Setup</a>
  </nav>
  <main>
    <div id="payments-root" aria-live="polite">
      <div class="head"><div><h1>Payments</h1><p class="caption">Loading your payments…</p></div></div>
    </div>
  </main>
</div>
<script defer src="money-payments.js"></script>
</body>
</html>
