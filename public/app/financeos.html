<!-- ══ FINANCEOS — THE CLIENT'S ONE-PAGE CRM FOR MONEY ══════════════════════
     Owner call 2026-10-06: "it all should be on 1 page — a one-page CRM for
     finances, called FinanceOS." Direction: docs/finance/finance-os-direction-2026-10-06.md.
     Board: ops/workflows/finance-os-pages-2026-10-06.md (unit P6).

     ONE HEADER, ONE TAB BAR, SIX SECTIONS. Each tab is a section another file
     owns, mounted with window.FinanceOS.sections.<key>.mount(el, ctx):
       Overview    money.js              Accounts  money-accounts.js
       Credit      money-credit.js       Connections money-connections.js
       Payments    money-payments.js     Setup     money-setup.js
     financeos.js owns the header, the tabs (state in the #hash), the lazy
     mount, the shared api calls and the sign-in redirect. A tab whose section
     is missing says "Coming soon" instead of breaking.

     CLIENT-FACING, SO NO shell.js — same as money.html. The real gate is each
     endpoint: a client session only ever gets its own file; staff need
     ?client_id=, which this page passes to every section.

     STYLES. Connections and Payments bring their own scoped files (linked
     above). The other four sections' rules are copied from their standalone
     pages and scoped under #fos-<tab>, so one section's .chart or .grid never
     reaches another. The Payments base rules are scoped with :where() so they
     keep their standalone weight under money-payments.css.

     .app on the wrapper so fundhub-brand.css sizes the type to the four tokens
     and gives .card the shared --panel-shadow. No px font sizes below, except
     the two chart-label escape hatches copied from money.html and
     money-credit.html (UI-STANDARDS §12.7). -->
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --surface:#FFFFFF;
  --text:var(--ink2);--text-dim:var(--gray);--text-faint:var(--gray2);
}
html,body{min-height:100%}
body{background:var(--paper);color:var(--text);font-family:var(--sans);font-size:var(--fs-body);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
ol,ul{list-style:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header — same dark bar as money.html */
.mbar{background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 24px;min-height:52px;border-bottom:2px solid transparent;border-image:var(--spectrum) 1;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;min-width:0;flex:0 1 auto}
.brand .logo{height:15px;aspect-ratio:2698/543;flex-shrink:0}
.brand .sub{color:var(--paper);font-weight:600;white-space:nowrap}
.brand .who{color:var(--gray2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.brand .who:empty{display:none}
.mbar a{color:var(--paper);text-decoration:underline;text-underline-offset:3px;min-height:40px;display:inline-flex;align-items:center}

/* The tab bar. The open tab is bold with a solid underline AND aria-selected —
   a shape, not only a colour (UI-STANDARDS §12.6). On a phone it scrolls
   sideways inside itself; the page never does (UI-STANDARDS §11). */
.fos-tabs{display:flex;gap:0 24px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;scrollbar-width:thin}
.fos-tabs a{display:inline-flex;align-items:center;min-height:44px;flex-shrink:0;color:var(--text-dim);text-decoration:none;border-bottom:2px solid transparent}
.fos-tabs a:hover{color:var(--ink)}
.fos-tabs a[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.fos-tabs a:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}

main{padding:24px 24px 64px}
.fos-panel[hidden]{display:none}

/* Sandbox banner — one for the whole page, from the overview read. Literal
   amber so it stays a warning on every tenant, and it says so in words
   (UI-STANDARDS §12.6). The Overview section paints the same words; with the
   page banner up, that copy is hidden so it is said once. */
.fos-sandbox{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;background:#FEF3C7;color:#92400E;border:1px solid #FCD34D;border-radius:8px;padding:8px 16px;margin-bottom:24px}
.fos-sandbox[hidden]{display:none}
.fos-has-sandbox #fos-overview .sandbox{display:none}

/* A tab whose section has not shipped yet. */
.fos-soon{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:24px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--panel-shadow)}
.fos-soon h2{font-weight:600;color:var(--ink)}
.fos-soon p{color:var(--text-dim);max-width:60ch}

@keyframes sk{0%{background-position:100% 0}100%{background-position:-100% 0}}

/* ════ SECTION RULES, SCOPED ════════════════════════════════════════════ */

#fos-credit table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
#fos-credit th{text-align:left;font-weight:500;color:var(--text-dim);padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
#fos-credit td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
#fos-credit .r{text-align:right}
#fos-credit td .used-bar{width:64px;margin-left:auto}
#fos-credit .empty,#fos-credit .error{display:flex;flex-direction:column;gap:16px;align-items:flex-start;padding:24px}
#fos-credit .empty p,#fos-credit .error p{max-width:60ch}
#fos-credit .skel{display:flex;flex-direction:column;gap:8px}
#fos-credit .sk{display:block;border-radius:6px;background:linear-gradient(90deg,var(--soft),var(--line),var(--soft));background-size:200% 100%;animation:sk 1.2s ease-in-out infinite}
#fos-credit .sk-s{height:12px;width:40%}
#fos-credit .sk-m{height:16px;width:70%}
#fos-credit .sk-l{height:32px;width:60%}
@media (prefers-reduced-motion:reduce){
  #fos-credit .sk{animation:none}
}
@media (max-width:1100px){
  #fos-credit .tiles>*{grid-column:span 6}

}
@media (max-width:760px){
  #fos-credit .tiles>*{grid-column:span 12}

/* ── setup — from money-setup.html ── */
#fos-setup .head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
#fos-setup .head h1{font-weight:600;letter-spacing:-.01em;color:var(--ink)}
#fos-setup .btn-primary{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 24px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:600;text-decoration:none}
#fos-setup .btn-primary:hover{background:var(--ink2)}
#fos-setup .btn-primary[disabled]{opacity:.6;cursor:default}
#fos-setup .btn-line{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 24px;border-radius:8px;border:1px solid var(--ink);background:var(--surface);color:var(--ink);font-weight:600;text-decoration:none}
#fos-setup .btn-line:hover{background:var(--soft)}
#fos-setup .btn-line[disabled]{opacity:.6;cursor:default}
#fos-setup .grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;margin-bottom:24px;align-items:start}
#fos-setup .grid>.steps-card{grid-column:span 8}
#fos-setup .grid>.price-card{grid-column:span 4}
#fos-setup .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 24px;box-shadow:var(--panel-shadow);min-width:0}
#fos-setup .eyebrow{display:block;font-family:var(--mono);font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);margin-bottom:8px}
#fos-setup .caption{color:var(--text-dim)}
#fos-setup .big,#fos-setup .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
#fos-setup .big{display:block;font-weight:500;color:var(--ink);line-height:1.2}
#fos-setup .num{font-weight:500;color:var(--ink)}
#fos-setup .step{display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px 16px;padding:16px 0;border-top:1px solid var(--line)}
#fos-setup .step:first-child{border-top:0}
#fos-setup .mark{width:40px;height:40px;border-radius:999px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:500;color:var(--text-dim)}
#fos-setup .step.done .mark{background:var(--ink);border-color:var(--ink);color:var(--paper)}
#fos-setup .step.now .mark{border-color:var(--ink);color:var(--ink)}
#fos-setup .step-body{display:flex;flex-direction:column;gap:8px;min-width:0}
#fos-setup .step-title{font-weight:600;color:var(--ink)}
#fos-setup .state{font-family:var(--mono);color:var(--text-dim)}
#fos-setup .step.done .state{color:var(--ink)}
#fos-setup .step-act{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
#fos-setup .act-msg:empty{display:none}
#fos-setup .price-list li{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-top:1px solid var(--line)}
#fos-setup .price-list li:first-child{border-top:0}
#fos-setup .price-line{margin-top:16px}
#fos-setup .error{display:flex;flex-direction:column;gap:16px;align-items:flex-start;padding:24px}
#fos-setup .error p{max-width:60ch}
#fos-setup .skel{display:flex;flex-direction:column;gap:8px}
#fos-setup .sk{display:block;border-radius:6px;background:linear-gradient(90deg,var(--soft),var(--line),var(--soft));background-size:200% 100%;animation:sk 1.2s ease-in-out infinite}
#fos-setup .sk-s{height:12px;width:40%}
#fos-setup .sk-m{height:16px;width:70%}
#fos-setup .sk-l{height:32px;width:60%}
@media (prefers-reduced-motion:reduce){
  #fos-setup .sk{animation:none}
}
@media (max-width:1100px){
  #fos-setup .grid>.steps-card,#fos-setup .grid>.price-card{grid-column:span 12}
}
@media (max-width:760px){
  #fos-setup .card{padding:16px}
}
