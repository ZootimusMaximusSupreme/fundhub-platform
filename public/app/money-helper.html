<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fundhub — Money helper</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0A0A0A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- ══ MONEY HELPER — THE FINANCEOS CHAT ═════════════════════════════════════
     Owner (2026-10-06): "AI tells you exactly what to do; press Do task to
     assign actions to AI agents." "Really set up the AI agent… so we can
     role-play and see it work." Board: ops/workflows/finance-os-wave5-2026-10-06.md,
     unit W6. Spec: docs/finance/client-finance-os-build-spec-2026-09-19.md §6.

     Reads one endpoint, GET /api/money/helper, and sends with POST
     { action: "send" }. The helper is agents FOS-01, SHADOW: it answers here and
     never texts. It thinks through Fundhub's shared model client (Claude Code
     on Chris's Mac today); the rules helper answers when no model is reachable.

     THIN SHELL. The section itself is window.FinanceOS.sections.helper.mount(el,
     ctx) in money-helper.js, styled by money-helper.css (every rule under
     .fh-helper), so /app/financeos.html can mount it as a tab. This page only
     gives it a header, the money nav and a box.

     CLIENT-FACING, SO NO shell.js — same as money.html. Own dark header, the
     shared money nav, no staff menu. The real gate is the endpoint: a client
     session only ever reads its own thread; staff need ?client_id=.

     .app on the wrapper: fundhub-brand.css sizes the type. No px font sizes
     below (UI-STANDARDS §12.7). -->
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--surface:#FFFFFF;--text:var(--ink2);--text-dim:var(--gray);--text-faint:var(--gray2)}
html,body{min-height:100%}
body{background:var(--paper);color:var(--text);font-family:var(--sans);font-size:var(--fs-body);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
ul{list-style:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header — same dark bar as money.html */
.mbar{background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 24px;min-height:52px;border-bottom:2px solid transparent;border-image:var(--spectrum) 1;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;min-width:0;flex:0 1 auto}
.brand .logo{height:15px;aspect-ratio:2698/543;flex-shrink:0}
.brand .sub{color:var(--gray2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbar a{color:var(--paper);text-decoration:underline;text-underline-offset:3px;min-height:40px;display:inline-flex;align-items:center}

/* the shared money nav (board: ops/workflows/finance-os-pages-2026-10-06.md).
   The page you are on is a solid ink fill AND aria-current — never colour alone. */
.mnav{display:flex;flex-wrap:wrap;gap:8px;padding:8px 24px;background:var(--surface);border-bottom:1px solid var(--line)}
.mnav a{display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border-radius:8px;text-decoration:none;color:var(--text-dim)}
.mnav a:hover{background:var(--soft);color:var(--ink)}
.mnav a[aria-current="page"]{background:var(--ink);color:var(--paper);font-weight:600}

main{padding:24px 24px 64px}

@media (max-width:760px){
  main{padding:16px 16px 48px}
  .mbar,.mnav{padding:8px 16px}
}
</style>
</head>
<body>
<div class="app">
  <header class="mbar">
    <div class="brand">
      <div class="logo inv" role="img" aria-label="Fundhub"></div>
      <div class="sub">Money helper</div>
    </div>
    <a id="money-back" href="client-portal.html">Back to my portal</a>
  </header>
  <nav class="mnav" id="money-nav" aria-label="Money">
    <a href="/app/financeos.html#overview">Money</a>
    <a href="/app/financeos.html#plan">Plan</a>
    <a href="/app/financeos.html#helper" aria-current="page">Helper</a>
    <a href="/app/financeos.html#accounts">Accounts</a>
    <a href="/app/financeos.html#credit">Credit</a>
    <a href="/app/financeos.html#connections">Connections</a>
    <a href="/app/financeos.html#payments">Payments</a>
    <a href="/app/financeos.html#setup">Setup</a>
  </nav>
  <main>
    <div id="helper-root" aria-live="polite">
      <div class="fh-helper"><div class="head"><div><h1>Money helper</h1><p class="caption">Loading your money helper…</p></div></div></div>
    </div>
  </main>
</div>
<script defer src="money-helper.js"></script>
</body>
</html>
