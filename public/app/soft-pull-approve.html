<!DOCTYPE html>
<html lang="en">
<head>
<!-- Shared Fundhub rounded typography; custom tenant fonts stay server-selected. -->
<link rel="preload" href="/assets/fonts/nunito-latin-variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/app/fundhub-font.css">
<script defer src="/app/fundhub-font.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fundhub · Soft-pull approval</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="fundhub-brand.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:var(--sans)}
.wrap{max-width:560px;margin:0 auto;padding:28px 18px 64px}
.mono{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gray2)}
h1{font-size:24px;font-weight:800;letter-spacing:-.03em;margin:10px 0 8px;line-height:1.15}
.lede{font-size:13.5px;color:var(--gray);line-height:1.5;margin:0 0 18px}
.card{border:1px solid var(--line);border-radius:12px;background:var(--soft);padding:16px;margin-bottom:14px}
.card h2{font-size:13px;font-weight:700;margin:0 0 8px}
.disc{font-size:12.5px;line-height:1.55;color:var(--ink);white-space:pre-wrap}
label{display:block;font-size:11.5px;font-weight:600;margin:12px 0 5px}
input{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font:inherit}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{margin-top:16px;width:100%;padding:12px 14px;border:0;border-radius:10px;background:var(--ink);color:var(--paper);font:700 13px var(--sans);cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-sec{margin-top:8px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:600 12.5px var(--sans);cursor:pointer}
.btn-pay{display:block;margin-top:14px;width:100%;padding:14px;border:0;border-radius:10px;background:var(--ink);color:var(--paper);font:700 14px var(--sans);text-align:center;text-decoration:none}
.err{border:1px solid #c45;background:#fff5f4;color:#6E2A22;padding:10px 12px;border-radius:8px;font-size:12.5px;margin-bottom:12px}
.ok{border:1px solid #2C5138;background:rgba(168,216,176,.26);color:#2C5138;padding:14px;border-radius:10px}
.fine{font-size:10.5px;color:var(--gray2);margin-top:12px;line-height:1.45}
ol.next{margin:0;padding-left:18px;font-size:12.5px;line-height:1.6;color:var(--ink)}
ol.next li{margin-bottom:4px}
ol.next li:last-child{margin-bottom:0}
.biz{border:1px dashed var(--line);border-radius:10px;padding:12px;margin-top:12px;background:var(--paper)}
.biz-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.biz-head strong{font-size:12px}
.biz-rm{border:0;background:transparent;color:var(--gray);font:600 11px var(--sans);cursor:pointer;padding:4px}
.total{font-size:14px;font-weight:700;margin-top:14px;padding:12px;border-radius:10px;background:var(--paper);border:1px solid var(--line)}
.total span{color:var(--gray);font-weight:500;font-size:12px}
</style>
<link rel="stylesheet" href="client-ios.css">
<link rel="stylesheet" href="soft-pull-approve-ios.css">
<link rel="stylesheet" href="/app/fundhub-astra.css">
<link rel="stylesheet" href="/app/fundhub-astra-client.css">
</head>
<body class="fh-astra fh-astra-client fh-astra-approval" data-client-page="soft-pull-approve" data-client-public>
<main class="wrap" id="app" aria-live="polite">
  <div class="mono">Fundhub · soft pull</div>
  <h1>Preparing your approval</h1>
  <p class="lede" role="status">Loading your secure authorization…</p>
  <div class="approval-skeleton" aria-hidden="true"><span></span><span></span><span></span></div>
</main>
<script src="client-ios.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var token = { org: q.get("org"), client: q.get("client"), exp: q.get("exp"), sig: q.get("sig") };
  var portalMode = q.get("portal") === "1";
  var root = document.getElementById("app");
  var pricing = { base_cents: 3200, business_addon_cents: 1000, max_businesses: 20, base_display: "$32", business_addon_display: "$10" };
  var bizCount = 0;
  var bizDrafts = [];

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function money(cents) {
    return "$" + (Number(cents) / 100).toFixed(0);
  }

  function apiUrl() {
    if (portalMode) return "/api/soft-pull-approve?portal=1";
    return "/api/soft-pull-approve?org=" + encodeURIComponent(token.org || "") +
      "&client=" + encodeURIComponent(token.client || "") +
      "&exp=" + encodeURIComponent(token.exp || "") +
      "&sig=" + encodeURIComponent(token.sig || "");
  }

  function authHeaders() {
    var headers = { "content-type": "application/json", accept: "application/json" };
    if (portalMode) {
      try {
        var session = localStorage.getItem("fh_token");
        if (session) headers.authorization = "Bearer " + session;
      } catch (_e) { /* HttpOnly session cookie remains available */ }
    }
    return headers;
  }

  function showErr(msg) {
    root.innerHTML =
      '<div class="mono">Fundhub · soft pull</div>' +
      '<h1>Link problem</h1>' +
      '<div class="err">' + esc(msg) + "</div>" +
      (portalMode
        ? '<p class="lede"><a href="/portal-login.html?mode=claim">Sign in to your portal</a> and open Soft pull again.</p>'
        : '<p class="lede">Stay on the call and ask your advisor to send a fresh link.</p>');
  }

  function needsAccount(body) {
    if (!body || body.error !== "account_required") return false;
    location.replace("/portal-login.html?mode=claim");
    return true;
  }

  function updateTotal() {
    var el = document.getElementById("total_line");
    if (!el) return;
    var total = pricing.base_cents + pricing.business_addon_cents * bizCount;
    el.innerHTML = "Total due: " + money(total) +
      ' <span>(' + esc(pricing.base_display) + " soft pull" +
      (bizCount ? " + " + bizCount + " × " + esc(pricing.business_addon_display) : "") +
      ")</span>";
  }

  function normalizeEin(raw) {
    var digits = String(raw == null ? "" : raw).replace(/\D/g, "");
    if (digits.length !== 9) return null;
    return digits.slice(0, 2) + "-" + digits.slice(2);
  }

  function readBizBlock(i) {
    var name = document.getElementById("biz_name_" + i);
    if (!name) return null;
    return {
      name: name.value,
      address_line1: document.getElementById("biz_line1_" + i).value,
      city: document.getElementById("biz_city_" + i).value,
      state: document.getElementById("biz_state_" + i).value,
      postal_code: document.getElementById("biz_zip_" + i).value,
      ein: document.getElementById("biz_ein_" + i).value,
      incorporated_date: document.getElementById("biz_inc_" + i).value,
      extra_owner_name: document.getElementById("biz_owner_" + i).value
    };
  }

  function fillBizBlock(i, row) {
    if (!row) return;
    document.getElementById("biz_name_" + i).value = row.name || "";
    document.getElementById("biz_line1_" + i).value = row.address_line1 || "";
    document.getElementById("biz_city_" + i).value = row.city || "";
    document.getElementById("biz_state_" + i).value = row.state || "";
    document.getElementById("biz_zip_" + i).value = row.postal_code || "";
    document.getElementById("biz_ein_" + i).value = row.ein || "";
    document.getElementById("biz_inc_" + i).value = row.incorporated_date || "";
    document.getElementById("biz_owner_" + i).value = row.extra_owner_name || "";
  }

  function snapshotBiz() {
    var list = [];
    for (var i = 0; i < bizCount; i++) {
      var row = readBizBlock(i);
      if (row) list.push(row);
    }
    return list.length ? list : bizDrafts.slice();
  }

  function bizBlockHtml(i) {
    return '<div class="biz" data-biz="' + i + '">' +
      '<div class="biz-head"><strong>Business ' + (i + 1) + '</strong>' +
      '<button type="button" class="biz-rm" data-rm="' + i + '">Remove</button></div>' +
      '<label for="biz_name_' + i + '">Business name</label>' +
      '<input id="biz_name_' + i + '" name="biz_name_' + i + '" required>' +
      '<label for="biz_line1_' + i + '">Business street address</label>' +
      '<input id="biz_line1_' + i + '" name="biz_line1_' + i + '" required>' +
      '<div class="row2"><div><label for="biz_city_' + i + '">City</label>' +
      '<input id="biz_city_' + i + '" name="biz_city_' + i + '" required></div>' +
      '<div><label for="biz_state_' + i + '">State</label>' +
      '<input id="biz_state_' + i + '" name="biz_state_' + i + '" maxlength="2" required placeholder="AZ"></div></div>' +
      '<label for="biz_zip_' + i + '">ZIP</label>' +
      '<input id="biz_zip_' + i + '" name="biz_zip_' + i + '" inputmode="numeric" required>' +
      '<label for="biz_ein_' + i + '">EIN</label>' +
      '<input id="biz_ein_' + i + '" name="biz_ein_' + i + '" inputmode="numeric" required placeholder="12-3456789">' +
      '<label for="biz_inc_' + i + '">When was this business incorporated?</label>' +
      '<input id="biz_inc_' + i + '" name="biz_inc_' + i + '" type="month" required>' +
      '<label for="biz_owner_' + i + '">Extra owner name (if any)</label>' +
      '<input id="biz_owner_' + i + '" name="biz_owner_' + i + '">' +
      "</div>";
  }

  function renderBizList(kept) {
    var box = document.getElementById("biz_list");
    var addBtn = document.getElementById("add_biz");
    if (!box) return;
    var snap = kept || snapshotBiz();
    var html = "";
    for (var i = 0; i < bizCount; i++) html += bizBlockHtml(i);
    box.innerHTML = html;
    for (var k = 0; k < bizCount && k < snap.length; k++) fillBizBlock(k, snap[k]);
    bizDrafts = snapshotBiz();
    if (addBtn) addBtn.disabled = bizCount >= pricing.max_businesses;
    box.querySelectorAll("[data-rm]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var idx = Number(btn.getAttribute("data-rm"));
        var next = [];
        for (var j = 0; j < bizCount; j++) {
          if (j === idx) continue;
          var row = readBizBlock(j);
          if (row) next.push(row);
        }
        bizCount = next.length;
        bizDrafts = next;
        renderBizList(next);
        updateTotal();
      });
    });
    updateTotal();
  }

  function collectBusinesses() {
    var list = [];
    for (var i = 0; i < bizCount; i++) {
      var row = readBizBlock(i);
      if (!row) continue;
      list.push({
        name: row.name.trim(),
        address_line1: row.address_line1.trim(),
        city: row.city.trim(),
        state: row.state.trim(),
        postal_code: row.postal_code.trim(),
        ein: row.ein.trim(),
        incorporated_date: row.incorporated_date.trim(),
        extra_owner_name: row.extra_owner_name.trim()
      });
    }
    return list;
  }

  function renderForm(data) {
    if (data.pricing) pricing = data.pricing;
    var name = data.contact && data.contact.first_name ? data.contact.first_name : "there";
    var already = data.consent && data.consent.valid;
    bizCount = 0;
    root.innerHTML =
      '<div class="mono">Fundhub · soft pull</div>' +
      "<h1>Approve your soft-pull assessment</h1>" +
      '<p class="lede">Hi ' + esc(name) + ". You can authorize now, even before your call. " +
      "Your information is saved securely. This is a soft inquiry and does not hurt your score. " +
      "The pull starts only after your authorization and payment are both on file.</p>" +
      (data.paid ? '<div class="ok">Payment is already on file. No second payment is needed.</div><br>' : "") +
      (already ? '<div class="ok">Your authorization is saved. You can update your details below if needed.</div><br>' : "") +
      '<div class="approval-layout"><aside class="approval-guidance" aria-label="Authorization details"><div class="card"><h2>Soft pull authorization</h2>' +
      '<div class="disc">' + esc((data.disclosure && data.disclosure.text) || "") + "</div>" +
      '<p class="fine">Version ' + esc((data.disclosure && data.disclosure.version) || "—") + "</p></div>" +
      '<div class="card"><h2>What happens next</h2><ol class="next">' +
      "<li>Your information is sent securely and saved for this authorization. Your advisor never sees your Social Security number.</li>" +
      (data.paid ? "<li>Your payment is already on file.</li>" :
      "<li>You pay the total shown — " + esc(pricing.base_display) + " soft pull plus " +
      esc(pricing.business_addon_display) + " per business.</li>") +
      "<li>When authorization and payment are both on file, we request the report. Nothing else is needed from you.</li>" +
      "</ol></div></aside>" +
      '<form id="f"><h2>Your details</h2><p class="form-intro">Enter your legal information to authorize the assessment.</p>' +
      '<label for="granted_name">Full legal name</label>' +
      '<input id="granted_name" name="granted_name" autocomplete="name" required>' +
      '<label for="ssn">Social Security number</label>' +
      '<input id="ssn" name="ssn" inputmode="numeric" autocomplete="off" required placeholder="123-45-6789">' +
      '<label for="dob">Date of birth</label>' +
      '<input id="dob" name="dob" type="date" required>' +
      '<label for="address_line1">Street address</label>' +
      '<input id="address_line1" name="address_line1" autocomplete="street-address" required>' +
      '<div class="row2"><div><label for="city">City</label><input id="city" name="city" required></div>' +
      '<div><label for="state">State</label><input id="state" name="state" maxlength="2" required placeholder="AZ"></div></div>' +
      '<label for="postal_code">ZIP</label>' +
      '<input id="postal_code" name="postal_code" inputmode="numeric" required>' +
      '<div class="card" style="margin-top:16px">' +
      "<h2>Add businesses (optional)</h2>" +
      "<p class=\"lede\" style=\"margin:0 0 8px\">If a company has other owners, say so. Extra owners make funding slower and harder. We usually prefer one-owner companies, but write the truth here anyway.</p>" +
      "<p class=\"lede\" style=\"margin:0 0 8px\">Add each business you want funded. Each one adds " +
      esc(pricing.business_addon_display) + ". Leave empty if you only need the personal soft pull.</p>" +
      '<div id="biz_list"></div>' +
      '<button type="button" class="btn-sec" id="add_biz">+ Add a business</button>' +
      '<div class="total" id="total_line"></div></div>' +
      '<button class="btn" type="submit" id="go">I agree — submit soft-pull approval</button>' +
      '<p class="fine">Your advisor cannot see this Social Security number on their screen. ' +
      "After you submit, pay the total from the Pay button (or the matching link in your email if you added no businesses).</p>" +
      '<div id="msg" role="status" aria-live="polite"></div></form></div>';

    document.getElementById("add_biz").addEventListener("click", function () {
      if (bizCount >= pricing.max_businesses) return;
      bizDrafts = snapshotBiz();
      bizCount += 1;
      renderBizList(bizDrafts);
    });
    renderBizList();

    document.getElementById("f").addEventListener("submit", function (e) {
      e.preventDefault();
      var btn = document.getElementById("go");
      var msg = document.getElementById("msg");
      btn.disabled = true;
      msg.innerHTML = "";

      var addr = {
        address_line1: document.getElementById("address_line1").value.trim(),
        city: document.getElementById("city").value.trim(),
        state: document.getElementById("state").value.trim(),
        postal_code: document.getElementById("postal_code").value.trim()
      };
      if (!addr.address_line1 || !addr.city || !addr.state || !addr.postal_code) {
        btn.disabled = false;
        msg.innerHTML = '<div class="err">Enter your current street address, city, state and ZIP.</div>';
        return;
      }

      var businesses = collectBusinesses();
      for (var i = 0; i < businesses.length; i++) {
        var b = businesses[i];
        if (!b.name || !b.address_line1 || !b.city || !b.state || !b.postal_code) {
          btn.disabled = false;
          msg.innerHTML = '<div class="err">Business ' + (i + 1) + ": fill name, street, city, state, and ZIP.</div>";
          return;
        }
        var ein = normalizeEin(b.ein);
        if (!ein) {
          btn.disabled = false;
          msg.innerHTML = '<div class="err">Business ' + (i + 1) + ": enter a 9-digit EIN (you can type 12-3456789).</div>";
          return;
        }
        b.ein = ein;
        if (!b.incorporated_date) {
          btn.disabled = false;
          msg.innerHTML = '<div class="err">Business ' + (i + 1) + ": enter when this business was incorporated (month and year).</div>";
          return;
        }
      }

      var body = {
        granted_name: document.getElementById("granted_name").value,
        ssn: document.getElementById("ssn").value,
        dob: document.getElementById("dob").value,
        address_line1: addr.address_line1,
        city: addr.city,
        state: addr.state,
        postal_code: addr.postal_code,
        businesses: businesses
      };
      if (!portalMode) {
        body.org = token.org;
        body.client = token.client;
        body.exp = token.exp;
        body.sig = token.sig;
      }
      fetch("/api/soft-pull-approve", {
        method: "POST",
        credentials: "include",
        headers: authHeaders(),
        body: JSON.stringify(body)
      }).then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); })
        .then(function (r) {
          if (needsAccount(r.body)) return;
          if (!r.body || !r.body.ok) {
            btn.disabled = false;
            msg.innerHTML = '<div class="err">' + esc((r.body && (r.body.message || r.body.error)) || "Could not save") + "</div>";
            return;
          }
          var pay = r.body.checkout && r.body.checkout.checkout_url;
          var total = (r.body.pricing && r.body.pricing.total_display) ||
            (r.body.checkout && r.body.checkout.amount_display) || pricing.base_display;
          root.innerHTML =
            '<div class="mono">Fundhub · soft pull</div>' +
            "<h1>Consent saved</h1>" +
            '<div class="ok">Your soft-pull authorization is on file. ' +
            esc(r.body.next || ("Pay " + total + " next.")) + "</div>" +
            (r.body.paid
              ? '<p class="lede">Payment is already on file. Your credit report will appear in your portal when the pull completes.</p>'
              : pay
              ? '<a class="btn-pay" href="' + esc(pay) + '">Pay ' + esc(total) + " assessment</a>"
              : '<p class="lede" style="margin-top:14px">Ask your advisor for the pay link for ' + esc(total) + ".</p>") +
            '<p class="lede" style="margin-top:14px">Once payment and authorization are both recorded, the soft pull starts automatically.</p>' +
            '<p class="lede"><a href="/app/client-portal.html">Back to my portal</a></p>';
        })
        .catch(function () {
          btn.disabled = false;
          msg.innerHTML = '<div class="err">Network error — try again.</div>';
        });
    });
  }

  if (!portalMode && (!token.org || !token.client || !token.exp || !token.sig)) {
    showErr("This page needs a full link from your advisor.");
    return;
  }

  fetch(apiUrl(), { credentials: "include", headers: authHeaders() })
    .then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); })
    .then(function (r) {
      if (needsAccount(r.body)) return;
      if (!r.body || !r.body.ok) {
        showErr((r.body && (r.body.message || r.body.error)) || "Could not open this link.");
        return;
      }
      renderForm(r.body);
    })
    .catch(function () { showErr("Could not reach the server."); });
})();
</script>
</body>
</html>
