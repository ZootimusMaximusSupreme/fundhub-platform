<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fundhub — Credit</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0A0A0A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="fundhub-brand.css">
<!-- ══ CREDIT — THE CLIENT'S CREDIT PAGE, LIKE CREDIT KARMA ══════════════════
     Direction: docs/finance/finance-os-direction-2026-10-06.md ("business
     credit like Credit Karma"). Board: ops/workflows/finance-os-pages-2026-10-06.md
     (unit P1). Reads ONE endpoint, GET /api/money/credit.

     CLIENT-FACING, SO NO shell.js — same reasons as money.html: its own dark
     header, no staff sidebar. The money pages share one nav (the board's
     "Shared nav" list, in that order). The real gate is the endpoint.

     .app on the wrapper so fundhub-brand.css sizes the type to the four tokens
     and gives .card the shared --panel-shadow. No px font sizes below, except
     the one chart-label escape hatch (UI-STANDARDS §12.7). -->
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --surface:#FFFFFF;
  --text:var(--ink2);--text-dim:var(--gray);--text-faint:var(--gray2);
}
html,body{min-height:100%}
body{background:var(--paper);color:var(--text);font-family:var(--sans);font-size:var(--fs-body);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
ul{list-style:none}

/* header — same dark bar as money.html */
.mbar{background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 24px;min-height:52px;border-bottom:2px solid transparent;border-image:var(--spectrum) 1;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;min-width:0;flex:0 1 auto}
.brand .logo{height:15px;aspect-ratio:2698/543;flex-shrink:0}
.brand .sub{color:var(--gray2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbar a{color:var(--paper);text-decoration:underline;text-underline-offset:3px;min-height:40px;display:inline-flex;align-items:center}

/* the money pages' shared nav. The current page is a solid fill and carries
   aria-current, so "where am I" never rests on colour (UI-STANDARDS §12.6). */
.mnav{background:var(--surface);border-bottom:1px solid var(--line);padding:8px 24px}
.mnav ul{display:flex;flex-wrap:wrap;gap:8px}
.mnav a{display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border-radius:8px;border:1px solid transparent;text-decoration:none;color:var(--text)}
.mnav a:hover{border-color:var(--line)}
.mnav a[aria-current="page"]{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}

main{padding:24px 24px 64px}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.head h1{font-weight:600;letter-spacing:-.01em;color:var(--ink)}
.btn-primary{display:inline-flex;align-items:center;min-height:44px;padding:8px 24px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:600;text-decoration:none}
.btn-primary:hover{background:var(--ink2)}

/* Sample banner — literal amber, not a brand variable, so it stays a warning
   on every tenant, and it says so in words (UI-STANDARDS §12.6). */
.sample{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;background:#FEF3C7;color:#92400E;border:1px solid #FCD34D;border-radius:8px;padding:8px 16px;margin-bottom:24px}

/* 12-column grid. Tiles span 3, halves span 6, one spans 12. */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;margin-bottom:24px}
.tiles>*{grid-column:span 3}
.two>*{grid-column:span 6}
.one>*{grid-column:span 12}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 24px;box-shadow:var(--panel-shadow);min-width:0}
.eyebrow{display:block;font-family:var(--mono);font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);margin-bottom:8px}
.caption{color:var(--text-dim)}
.big,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.big{display:block;font-weight:500;color:var(--ink);line-height:1.2}
.num{font-weight:500;color:var(--ink)}
.tile{display:flex;flex-direction:column;gap:8px}
.band-word{font-weight:600;color:var(--ink)}

/* score gauge: a half ring, inline SVG, no library */
.gauge{display:block;width:100%;max-width:200px;height:auto}
.gauge-track{fill:none;stroke:var(--soft);stroke-width:10;stroke-linecap:round}
.gauge-fill{fill:none;stroke:var(--ink);stroke-width:10;stroke-linecap:round}

.used-bar{display:block;width:100%;height:8px}
.used-track{fill:var(--soft)}
.used-fill{fill:var(--ink)}

.block{margin-bottom:48px}
.says li{padding:8px 0;border-top:1px solid var(--line)}
.says li:first-child{border-top:0}

.chart{display:block;width:100%;height:auto;max-height:220px;margin:8px 0}
.chart-base{stroke:var(--line);stroke-width:1}
.line{fill:none;stroke:var(--ink);stroke-width:2}
.line-eq{stroke-dasharray:8 4}
.line-tu{stroke-dasharray:2 4}
.dot{fill:var(--ink)}
.chart-label{fill:var(--text-dim);font-family:var(--sans)}
/* THIS SCREEN'S ONE TYPE ESCAPE HATCH (UI-STANDARDS §12.7), the same rule as
   money.html. Chart labels are SVG text in viewBox units and the viewBox is
   scaled to the card; the brand file's 16px inherit would blow them up. */
.app .chart text{font-size:11px !important}
.legend{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.key{display:inline-block;width:24px;height:0;border-top:2px solid var(--ink);vertical-align:middle;margin-right:8px}
.key-eq{border-top-style:dashed}
.key-tu{border-top-style:dotted}

.scroll-x{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:500;color:var(--text-dim);padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
.r{text-align:right}
td .used-bar{width:64px;margin-left:auto}

.empty,.error{display:flex;flex-direction:column;gap:16px;align-items:flex-start;padding:24px}
.empty p,.error p{max-width:60ch}

/* loading skeletons, in the real layout */
.skel{display:flex;flex-direction:column;gap:8px}
.sk{display:block;border-radius:6px;background:linear-gradient(90deg,var(--soft),var(--line),var(--soft));background-size:200% 100%;animation:sk 1.2s ease-in-out infinite}
.sk-s{height:12px;width:40%}.sk-m{height:16px;width:70%}.sk-l{height:32px;width:60%}
@keyframes sk{0%{background-position:100% 0}100%{background-position:-100% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}

@media (max-width:1100px){
  .tiles>*{grid-column:span 6}
  .two>*{grid-column:span 12}
}
@media (max-width:760px){
  main{padding:16px 16px 48px}
  .mbar,.mnav{padding:8px 16px}
  .tiles>*{grid-column:span 12}
  .card{padding:16px}
}
</style>
</head>
<body>
<div class="app">
  <header class="mbar">
    <div class="brand">
      <div class="logo inv" role="img" aria-label="Fundhub"></div>
      <div class="sub">Credit</div>
    </div>
    <a id="money-back" href="client-portal.html">Back to my portal</a>
  </header>
  <nav class="mnav" aria-label="Money pages">
    <ul>
      <li><a href="/app/financeos.html#overview">Money</a></li>
      <li><a href="/app/financeos.html#accounts">Accounts</a></li>
      <li><a href="/app/financeos.html#credit" aria-current="page">Credit</a></li>
      <li><a href="/app/financeos.html#connections">Connections</a></li>
      <li><a href="/app/financeos.html#payments">Payments</a></li>
      <li><a href="/app/financeos.html#setup">Setup</a></li>
    </ul>
  </nav>
  <main>
    <div id="credit-root" aria-live="polite">
      <div class="head"><div><h1>Credit</h1><p class="caption">Loading your credit…</p></div></div>
    </div>
  </main>
</div>
<script defer src="money-credit.js"></script>
</body>
</html>
