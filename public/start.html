<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start | fundhub</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="robots" content="noindex">
<style>
  :root{--ink:#0A0A0A;--paper:#FCFCFC;--gray:#52525B;--line:#E4E4E7;--sans:Inter,system-ui,sans-serif;--mono:ui-monospace,SFMono-Regular,monospace}
  *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5}
  .wrap{max-width:520px;margin:12vh auto;padding:0 24px;text-align:center}
  .code{font-family:var(--mono);letter-spacing:.08em;font-size:13px;color:var(--gray);margin-bottom:12px}
  h1{font-size:28px;font-weight:650;margin:0 0 12px}
  p{color:var(--gray);margin:0 0 24px}
  a.btn{display:inline-block;background:var(--ink);color:#fff;padding:12px 22px;border-radius:999px;text-decoration:none;font-weight:600}
</style>
</head>
<body>
  <div class="wrap">
    <div class="code" id="code">Referral</div>
    <h1>Continue to apply</h1>
    <p id="lead">This link belongs to an affiliate. We will send you to the Fundhub apply form with their code attached.</p>
    <a class="btn" id="go" href="https://apply.fundhub.ai/watch">Go to apply</a>
  </div>
  <script>
    (function () {
      // Live funnel. Bare apply.fundhub.ai/ can 302 to the wrong CF theme;
      // /apply headless-bot-skips and drops query params; /watch keeps a1/ref.
      var APPLY = "https://apply.fundhub.ai/watch";
      var params = new URLSearchParams(location.search);
      var ref = String(params.get("ref") || params.get("a1") || "").trim();
      if (ref) {
        try { localStorage.setItem("fh_ref", ref); } catch (e) {}
        document.getElementById("code").textContent = "Code " + ref;
      } else {
        document.getElementById("code").textContent = "No code on this link";
        document.getElementById("lead").textContent = "Open the apply form to continue.";
      }
      var dest = APPLY;
      if (ref) dest += "?a1=" + encodeURIComponent(ref) + "&ref=" + encodeURIComponent(ref);
      // via=start: this page already counted the click; fh-attribution.js on
      // the funnel page skips counting it again.
      if (ref) dest += "&via=start";
      document.getElementById("go").href = dest;
      function goApply() { location.replace(dest); }
      if (!ref) return;
      // Record the visit before bounce. Fire-and-forget; never block apply.
      var body = JSON.stringify({ code: ref, source: "start", landing_path: location.pathname + location.search });
      var sent = false;
      try {
        if (navigator.sendBeacon) {
          sent = navigator.sendBeacon("/api/public/affiliate-click", new Blob([body], { type: "application/json" }));
        }
      } catch (e) {}
      if (!sent) {
        fetch("/api/public/affiliate-click", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: body,
          keepalive: true
        }).catch(function () {}).finally(goApply);
        return;
      }
      goApply();
    })();
  </script>
  <script src="/js/clarity.js" defer></script>
<script src="/funnel/rb2b.js"></script>
</body>
</html>
